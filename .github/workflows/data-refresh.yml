name: Rolling complaint data refresh (ON HOLD)
on:
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild even when source content is unchanged
        type: boolean
        default: false
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: complaint-data-refresh
  cancel-in-progress: true
jobs:
  refresh:
    # Explicit hold: resume only after access is verified and the hold is lifted.
    if: ${{ false }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-refresh.txt
      - run: pip install -r requirements-refresh.txt
      - name: Test retention, revised inputs and export reconciliation
        run: python scripts/test_refresh_pipeline.py
      - uses: actions/cache/restore@v4
        with:
          path: data/source_cache
          key: cfpb-source-${{ github.run_id }}
          restore-keys: cfpb-source-
      - name: Discover and validate refreshed data
        env:
          FORCE_REFRESH: ${{ inputs.force || false }}
        run: |
          if [ "$FORCE_REFRESH" = "true" ]; then
            python scripts/refresh_pipeline.py --force
          else
            python scripts/refresh_pipeline.py
          fi
      - uses: actions/cache/save@v4
        with:
          path: data/source_cache
          key: cfpb-source-${{ github.run_id }}
      - name: Publish validated release through a pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ ! -f data/release/refresh_manifest.json ]; then
            echo "No changed release to publish."
            exit 0
          fi
          cp data/release/dashboard_*.parquet .
          cp data/release/refresh_manifest.json reports/refresh_manifest.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f dashboard_daily_company_product.parquet dashboard_issues.parquet dashboard_geography.parquet dashboard_channels.parquet
          git add reports/refresh_manifest.json
          git checkout -b "automated/data-refresh-${GITHUB_RUN_ID}"
          git commit -m 'Refresh validated rolling 36-month complaint datasets'
          git push origin HEAD
          cat > /tmp/refresh-pr.md <<'BODY'
          Update the dashboard's rolling 36-month complaint window from the latest official CFPB archives. All four exports are published together with their source hashes and validation metadata.

          Validation: synthetic retention and revised-record tests; full dbt build and 126 data tests; all additive metric totals reconciled across four exports. Failure before merge leaves the current dashboard datasets in place.

          This PR was created by GITHUB_TOKEN; GitHub does not trigger additional PR workflows for token-generated events. Validation above ran in the scheduled refresh job. Required branch checks are respected and may leave this PR pending.
          BODY
          pr_url=$(gh pr create --base main --head "automated/data-refresh-${GITHUB_RUN_ID}" --title 'Refresh rolling 36-month complaint datasets' --body-file /tmp/refresh-pr.md)
          gh pr merge "$pr_url" --merge
      - name: Preserve build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: refresh-evidence-${{ github.run_id }}
          retention-days: 14
          if-no-files-found: ignore
          path: |
            dbt/target/run_results.json
            dbt/target/manifest.json
            dbt/logs/dbt.log
            data/release/refresh_manifest.json
