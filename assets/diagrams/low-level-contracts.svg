, sans-serif" font-size="13" fill="#40566C" font-weight="400">ETag / Last-Modified when available</text><text x="485" y="433" font-family="Arial, sans-serif" font-size="13" fill="#40566C" font-weight="400">SHA-256 cache verification</text><text x="485" y="456" font-family="Arial, sans-serif" font-size="13" fill="#40566C" font-weight="400">Incomplete download never promoted</text><rect x="860" y="310" width="350" height="165" rx="12" fill="#FFFFFF" stroke="#C1CFDD" stroke-width="1.5"/><rect x="860" y="324" width="5" height="137" rx="2" fill="#7555A1"/><rect x="876" y="328" width="54" height="54" rx="10" fill="#EEF3F8" stroke="#EEF3F8" stroke-width="1.5"/><g transform="translate(881,333)"><svg xmlns="http://www.w3.org/2000/svg" width="44" height="44" viewBox="0 0 44 44"><g fill="#7555A1" color="#7555A1"><path d="M8 3h21l9 10v28H8z"/><path d="M28 3v12h10M14 22h18m-18 7h18m-18 7h12" fill="none" stroke="white" stroke-width="2"/></g></svg></g><text x="942" y="345" font-family="Arial, sans-serif" font-size="17" fill="#122B45" font-weight="700">Revision identity</text><text x="942" y="365" font-family="Arial, sans-serif" font-size="11" fill="#7555A1" font-weight="700">CONTRACT / SHA-256</text><text x="880" y="410" font-family="Arial, sans-serif" font-size="13" fill="#40566C" font-weight="400">Source bytes + code + window</text><text x="880" y="433" font-family="Arial, sans-serif" font-size="13" fill="#40566C" font-weight="400">Latest labelled month; [start, end)</text><text x="880" y="456" font-family="Arial, sans-serif" font-size="13" fill="#40566C" font-weight="400">Unchanged revision skips rebuild</text><rect x="1255" y="310" width="375" height="165" rx="14" fill="#FFFFFF" stroke="#C1CFDD" stroke-width="1.5"/><text x="1273" y="338" font-family="Arial, sans-serif" font-size="14" fill="#B84C48" font-weight="700">TRIGGER / PRECONDITIONS</text><text x="1273" y="364" font-family="Arial, sans-serif" font-size="12" fill="#63758A" font-weight="400">Daily scheduler or manual force</text><text x="1273" y="385" font-family="Arial, sans-serif" font-size="12" fill="#63758A" font-weight="400">Validate catalogue coverage</text><text x="1273" y="406" font-family="Arial, sans-serif" font-size="12" fill="#63758A" font-weight="400">Check available runner disk</text><text x="1273" y="427" font-family="Arial, sans-serif" font-size="12" fill="#63758A" font-weight="400">HTTP 403 currently blocks ZIP fetch</text><path d="M420 392 L465 392" fill="none" stroke="#63758A" stroke-width="2" marker-end="url(#arrow)"/><text x="423" y="381" font-family="Arial, sans-serif" font-size="11" fill="#63758A" font-weight="400">URLs</text><path d="M815 392 L860 392" fill="none" stroke="#63758A" stroke-width="2" marker-end="url(#arrow)"/><text x="819" y="381" font-family="Arial, sans-serif" font-size="11" fill="#63758A" font-weight="400">Hashes</text><rect x="45" y="545" width="1610" height="490" rx="16" fill="#EAF0F6" stroke="#BBCAD8" stroke-width="1.5"/><text x="63" y="574" font-family="Arial, sans-serif" font-size="15" fill="#087F8C" font-weight="700">02  DATA / REFRESH_WORK  ·  FRESH DUCKDB BUILD</text><text x="63" y="596" font-family="Arial, sans-serif" font-size="12" fill="#63758A" font-weight="400">Runner-local source processing and dbt materialization</text><rect x="70" y="625" width="350" height="165" rx="12" fill="#FFFFFF" stroke="#C1CFDD" stroke-width="1.5"/><rect x="70" y="639" width="5" height="137" rx="2" fill="#3466AC"/><rect x="86" y="643" width="54" height="54" rx="10" fill="#EEF3F8" stroke="#EEF3F8" stroke-width="1.5"/><g transform="translate(91,648)"><svg xmlns="http://www.w3.org/2000/svg" width="44" height="44" viewBox="0 0 44 44"><g fill="#3466AC" color="#3466AC"><ellipse cx="22" cy="10" rx="16" ry="6"/><path d="M6 10v23c0 8 32 8 32 0V10c-8 7-24 7-32 0z"/><path d="M7 21c8 6 22 6 30 0" fill="none" stroke="white" stroke-width="2"/></g></svg></g><text x="152" y="660" font-family="Arial, sans-serif" font-size="17" fill="#122B45" font-weight="700">Retained bronze</text><text x="152" y="680" font-family="Arial, sans-serif" font-size="11" fill="#3466AC" font-weight="700">TABLE / MAIN.BRONZE_COMPLAINTS</text><text x="90" y="725" font-family="Arial, sans-serif" font-size="13" fill="#40566C" font-weight="400">50,000-row chunks; 16 raw fields</text><text x="90" y="748" font-family="Arial, sans-serif" font-size="13" fill="#40566C" font-weight="400">Received-date window; provenance</text><text x="90" y="771" font-family="Arial, sans-serif" font-size="13" fill="#40566C" font-weight="400">Trimmed ID: latest release wins</text><rect x="465" y="625" width="350" height="165" rx="12" fill="#FFFFFF" stroke="#C1CFDD" stroke-width="1.5"/><rect x="465" y="639" width="5" height="137" rx="2" fill="#087F8C"/><rect x="481" y="643" width="54" height="54" rx="10" fill="#EEF3F8" stroke="#EEF3F8" stroke-width="1.5"/><g transform="translate(486,648)"><svg xmlns="http://www.w3.org/2000/svg" width="44" height="44" viewBox="0 0 44 44"><g fill="#087F8C" color="#087F8C"><rect x="2" y="5" width="40" height="34" rx="4"/><path d="m15 15-8 7 8 7m14-14 8 7-8 7m-5-17-4 22" fill="none" stroke="white" stroke-width="2.5"/></g></svg></g><text x="547" y="660" font-family="Arial, sans-serif" font-size="17" fill="#122B45" font-weight="700">Typed staging</text><text x="547" y="680" font-family="Arial, sans-serif" font-size="11" fill="#087F8C" font-weight="700">VIEWS / MAIN_STAGING</text><text x="485" y="725" font-family="Arial, sans-serif" font-size="13" fill="#40566C" font-weight="400">Parse dates; Yes/No → boolean</text><text x="485" y="748" font-family="Arial, sans-serif" font-size="13" fill="#40566C" font-weight="400">Optional blank categories → NULL</text><text x="485" y="771" font-family="Arial, sans-serif" font-size="13" fill="#40566C" font-weight="400">IDs and ZIP remain text</text><rect x="860" y="625" width="350" height="165" rx="12" fill="#FFFFFF" stroke="#C1CFDD" stroke-width="1.5"/><rect x="860" y="639" width="5" height="137" rx="2" fill="#087F8C"/><rect x="876" y="643" width="54" height="54" rx="10" fill="#EEF3F8" stroke="#EEF3F8" stroke-width="1.5"/><g transform="translate(881,648)"><svg xmlns="http://www.w3.org/2000/svg" width="44" height="44" viewBox="0 0 44 44"><g fill="#087F8C" color="#087F8C"><ellipse cx="22" cy="10" rx="16" ry="6"/><path d="M6 10v23c0 8 32 8 32 0V10c-8 7-24 7-32 0z"/><path d="M7 21c8 6 22 6 30 0" fill="none" stroke="white" stroke-width="2"/></g></svg></g><text x="942" y="660" font-family="Arial, sans-serif" font-size="17" fill="#122B45" font-weight="700">Normalized silver</text><text x="942" y="680" font-family="Arial, sans-serif" font-size="11" fill="#087F8C" font-weight="700">8 TABLES / MAIN_SILVER</text><text x="880" y="725" font-family="Arial, sans-serif" font-size="13" fill="#40566C" font-weight="400">Complaint + dimensions + narratives</text><text x="880" y="748" font-family="Arial, sans-serif" font-size="13" fill="#40566C" font-weight="400">Tags + complaint/tag bridge</text><text x="880" y="771" font-family="Arial, sans-serif" font-size="13" fill="#40566C" font-weight="400">JSON → MD5 category keys</text><rect x="1255" y="625" width="375" height="165" rx="12" fill="#FFFFFF" stroke="#C1CFDD" stroke-width="1.5"/><rect x="1255" y="639" width="5" height="137" rx="2" fill="#B47A13"/><rect x="1271" y="643" width="54" height="54" rx="10" fill="#EEF3F8" stroke="#EEF3F8" stroke-width="1.5"/><g transform="translate(1276,648)"><svg xmlns="http://www.w3.org/2000/svg" width="44" height="44" viewBox="0 0 44 44"><g fill="#B47A13" color="#B47A13"><ellipse cx="22" cy="10" rx="16" ry="6"/><path d="M6 10v23c0 8 32 8 32 0V10c-8 7-24 7-32 0z"/><path d="M7 21c8 6 22 6 30 0" fill="none" stroke="white" stroke-width="2"/></g></svg></g><text x="1337" y="660" font-family="Arial, sans-serif" font-size="17" fill="#122B45" font-weight="700">Complaint metrics</text><text x="1337" y="680" font-family="Arial, sans-serif" font-size="11" fill="#B47A13" font-weight="700">TABLE / MAIN_GOLD</text><text x="1275" y="725" font-family="Arial, sans-serif" font-size="13" fill="#40566C" font-weight="400">One row per complaint</text><text x="1275" y="748" font-family="Arial, sans-serif" font-size="13" fill="#40566C" font-weight="400">18 additive 0/1 count flags</text><text x="1275" y="771" font-family="Arial, sans-serif" font-size="13" fill="#40566C" font-weight="400">Narrative search view, not vectors</text><rect x="465" y="845" width="350" height="165" rx="12" fill="#FFFFFF" stroke="#C1CFDD" stroke-width="1.5"/><rect x="465" y="859" width="5" height="137" rx="2" fill="#087F8C"/><rect x="481" y="863" width="54" height="54" rx="10" fill="#EEF3F8" stroke="#EEF3F8" stroke-width="1.5"/><g transform="translate(486,868)"><svg xmlns="http://www.w3.org/2000/svg" width="44" height="44" viewBox="0 0 44 44"><g fill="#087F8C" color="#087F8C"><path d="M22 3 39 9v12c0 11-8 17-17 21C13 38 5 32 5 21V9z"/><path d="m12 22 7 7 13-15" fill="none" stroke="white" stroke-width="3"/></g></svg></g><text x="547" y="880" font-family="Arial, sans-serif" font-size="17" fill="#122B45" font-weight="700">Build / invariant gate</text><text x="547" y="900" font-family="Arial, sans-serif" font-size="11" fill="#087F8C" font-weight="700">DBT BUILD / 126 DATA TESTS</text><text x="485" y="945" font-family="Arial, sans-serif" font-size="13" fill="#40566C" font-weight="400">Unique keys + relationships</text><text x="485" y="968" font-family="Arial, sans-serif" font-size="13" fill="#40566C" font-weight="400">Row and narrative preservation</text><text x="485" y="991" font-family="Arial, sans-serif" font-size="13" fill="#40566C" font-weight="400">Flags + star/wide reconciliation</text><rect x="1255" y="845" width="375" height="165" rx="12" fill="#FFFFFF" stroke="#C1CFDD" stroke-width="1.5"/><rect x="1255" y="859" width="5" height="137" rx="2" fill="#B47A13"/><rect x="1271" y="863" width="54" height="54" rx="10" fill="#EEF3F8" stroke="#EEF3F8" stroke-width="1.5"/><g transform="translate(1276,868)"><svg xmlns="http://www.w3.org/2000/svg" width="44" height="44" viewBox="0 0 44 44"><g fill="#B47A13" color="#B47A13"><ellipse cx="22" cy="10" rx="16" ry="6"/><path d="M6 10v23c0 8 32 8 32 0V10c-8 7-24 7-32 0z"/><path d="M7 21c8 6 22 6 30 0" fill="none" stroke="white" stroke-width="2"/></g></svg></g><text x="1337" y="880" font-family="Arial, sans-serif" font-size="17" fill="#122B45" font-weight="700">Dimensional gold</text><text x="1337" y="900" font-family="Arial, sans-serif" font-size="11" fill="#B47A13" font-weight="700">TABLES / MAIN_STAR</text><text x="1275" y="945" font-family="Arial, sans-serif" font-size="13" fill="#40566C" font-weight="400">fact_complaints + 7 dimensions</text><text x="1275" y="968" font-family="Arial, sans-serif" font-size="13" fill="#40566C" font-weight="400">Two date roles; YYYYMMDD keys</text><text x="1275" y="991" font-family="Arial, sans-serif" font-size="13" fill="#40566C" font-weight="400">Flags derive from the wide model</text><rect x="70" y="845" width="350" height="165" rx="14" fill="#FFFFFF" stroke="#C1CFDD" stroke-width="1.5"/><text x="88" y="873" font-family="Arial, sans-serif" font-size="14" fill="#7555A1" font-weight="700">KEY / OVERLAP RULES</text><text x="88" y="899" font-family="Arial, sans-serif" font-size="12" fill="#63758A" font-weight="400">Source IDs are strings, not integers</text><text x="88" y="920" font-family="Arial, sans-serif" font-size="12" fill="#63758A" font-weight="400">Archive ordinal DESC, record DESC</text><text x="88" y="941" font-family="Arial, sans-serif" font-size="12" fill="#63758A" font-weight="400">Logical record number precedes filter</text><text x="88" y="962" font-family="Arial, sans-serif" font-size="12" fill="#63758A" font-weight="400">No inferred company entity merging</text><rect x="860" y="845" width="350" height="165" rx="14" fill="#FFFFFF" stroke="#C1CFDD" stroke-width="1.5"/><text x="878" y="873" font-family="Arial, sans-serif" font-size="14" fill="#B47A13" font-weight="700">NEXT BOUNDARY: DATA / RELEASE</text><text x="878" y="899" font-family="Arial, sans-serif" font-size="12" fill="#63758A" font-weight="400">Four exports, each sum reconciled</text><text x="878" y="920" font-family="Arial, sans-serif" font-size="12" fill="#63758A" font-weight="400">Manifest holds hashes + validation</text><text x="878" y="941" font-family="Arial, sans-serif" font-size="12" fill="#63758A" font-weight="400">90 MiB per-file serving guard</text><text x="878" y="962" font-family="Arial, sans-serif" font-size="12" fill="#63758A" font-weight="400">See LLD 02 and LLD 03</text><path d="M1035 475 L1035 520 L245 520 L245 625" fill="none" stroke="#63758A" stroke-width="2" marker-end="url(#arrow)"/><text x="420" y="513" font-family="Arial, sans-serif" font-size="11" fill="#63758A" font-weight="400">Changed revision → ingest retained source records</text><path d="M420 708 L465 708" fill="none" stroke="#63758A" stroke-width="2" marker-end="url(#arrow)"/><text x="424" y="697" font-family="Arial, sans-serif" font-size="11" fill="#63758A" font-weight="400">Rows</text><path d="M815 708 L860 708" fill="none" stroke="#63758A" stroke-width="2" marker-end="url(#arrow)"/><text x="819" y="697" font-family="Arial, sans-serif" font-size="11" fill="#63758A" font-weight="400">Keys</text><path d="M1210 708 L1255 708" fill="none" stroke="#63758A" stroke-width="2" marker-end="url(#arrow)"/><text x="1214" y="697" font-family="Arial, sans-serif" font-size="11" fill="#63758A" font-weight="400">Joins</text><path d="M1442 790 L1442 845" fill="none" stroke="#63758A" stroke-width="2" marker-end="url(#arrow)"/><text x="1455" y="820" font-family="Arial, sans-serif" font-size="11" fill="#63758A" font-weight="400">Reuse metric flags</text><path d="M1442 1010 L1442 1024 L640 1024 L640 1010" fill="none" stroke="#63758A" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="6 5"/><text x="710" y="1018" font-family="Arial, sans-serif" font-size="11" fill="#63758A" font-weight="400">Validate all layers before publication</text><rect x="45" y="1070" width="1610" height="75" rx="14" fill="#FFFFFF" stroke="#C1CFDD" stroke-width="1.5"/><text x="63" y="1098" font-family="Arial, sans-serif" font-size="14" fill="#B84C48" font-weight="700">FAIL CLOSED</text><text x="63" y="1124" font-family="Arial, sans-serif" font-size="12" fill="#63758A" font-weight="400">Missing fields, invalid received dates, missing IDs, catalogue gaps, download errors or failed assertions abort the release; no silent row quarantine.</text><text x="54" y="1167" font-family="Arial, sans-serif" font-size="12" fill="#63758A" font-weight="400">LEGEND  ·  Filled icons = component type  |  Solid cards = implemented  |  Dashed cards = planned</text><text x="54" y="1190" font-family="Arial, sans-serif" font-size="12" fill="#63758A" font-weight="400">Solid arrows = data / publication flow  |  Dashed arrows = control / development flow  |  Bronze here is retention-filtered; durable raw source preservation is not implemented</text></svg>