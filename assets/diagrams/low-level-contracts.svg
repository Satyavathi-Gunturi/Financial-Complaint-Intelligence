<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="880" viewBox="0 0 1400 880" role="img"><title>Refresh and Serving Contracts</title><desc>LOW-LEVEL DESIGN · Source identity, retention, model invariants and atomic publication</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#7f93a6"/></marker></defs><rect width="1400" height="880" fill="#f5f8fb"/><text x="50" y="54" font-family="Arial" font-size="28" font-weight="700" fill="#18344f">Refresh and Serving Contracts</text><text x="50" y="83" font-family="Arial" font-size="14" fill="#687e91">LOW-LEVEL DESIGN · Source identity, retention, model invariants and atomic publication</text><path d="M450 217.5 L500 217.5" stroke="#7f93a6" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M900 217.5 L950 217.5" stroke="#7f93a6" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M1150.0 300 L1150.0 385" stroke="#7f93a6" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M950 467.5 L900 467.5" stroke="#7f93a6" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M500 467.5 L450 467.5" stroke="#7f93a6" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M250.0 550 L250.0 635" stroke="#7f93a6" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M450 717.5 L500 717.5" stroke="#7f93a6" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M900 717.5 L950 717.5" stroke="#7f93a6" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="50" y="135" width="400" height="165" rx="16" fill="white" stroke="#c5d1dc"/><rect x="68" y="155" width="38" height="38" rx="10" fill="#147d83"/><g transform="translate(75,163)" fill="white"><ellipse cx="12" cy="3" rx="11" ry="3"/><path d="M1 3v6c0 5 22 5 22 0V3c-5 4-17 4-22 0zM1 13v6c0 5 22 5 22 0v-6c-5 4-17 4-22 0z"/></g><text x="120" y="179" font-family="Arial" font-size="17" font-weight="700" fill="#18344f">1 / Source identity</text><text x="70" y="217" font-family="Arial" font-size="13" fill="#52657a">Allowlisted official HTTPS archive links</text><text x="70" y="240" font-family="Arial" font-size="13" fill="#52657a">Verified cached ZIP bytes + validators</text><text x="70" y="263" font-family="Arial" font-size="13" fill="#52657a">SHA-256 sources / code / window revision</text><rect x="500" y="135" width="400" height="165" rx="16" fill="white" stroke="#c5d1dc"/><rect x="518" y="155" width="38" height="38" rx="10" fill="#147d83"/><g transform="translate(525,163)" fill="white"><ellipse cx="12" cy="3" rx="11" ry="3"/><path d="M1 3v6c0 5 22 5 22 0V3c-5 4-17 4-22 0zM1 13v6c0 5 22 5 22 0v-6c-5 4-17 4-22 0z"/></g><text x="570" y="179" font-family="Arial" font-size="17" font-weight="700" fill="#18344f">2 / Retention contract</text><text x="520" y="217" font-family="Arial" font-size="13" fill="#52657a">Latest archive-labelled month anchors window</text><text x="520" y="240" font-family="Arial" font-size="13" fill="#52657a">Keep [start, end) received dates; 36 months</text><text x="520" y="263" font-family="Arial" font-size="13" fill="#52657a">Reject invalid dates / missing IDs / fields</text><rect x="950" y="135" width="400" height="165" rx="16" fill="white" stroke="#c5d1dc"/><rect x="968" y="155" width="38" height="38" rx="10" fill="#147d83"/><g transform="translate(975,163)" fill="white"><ellipse cx="12" cy="3" rx="11" ry="3"/><path d="M1 3v6c0 5 22 5 22 0V3c-5 4-17 4-22 0zM1 13v6c0 5 22 5 22 0v-6c-5 4-17 4-22 0z"/></g><text x="1020" y="179" font-family="Arial" font-size="17" font-weight="700" fill="#18344f">3 / Complaint identity</text><text x="970" y="217" font-family="Arial" font-size="13" fill="#52657a">Preserve source filename and record number</text><text x="970" y="240" font-family="Arial" font-size="13" fill="#52657a">Higher archive ordinal wins overlapping IDs</text><text x="970" y="263" font-family="Arial" font-size="13" fill="#52657a">One winning bronze row per complaint ID</text><rect x="50" y="385" width="400" height="165" rx="16" fill="white" stroke="#c5d1dc"/><rect x="68" y="405" width="38" height="38" rx="10" fill="#147d83"/><g transform="translate(75,413)" fill="white"><ellipse cx="12" cy="3" rx="11" ry="3"/><path d="M1 3v6c0 5 22 5 22 0V3c-5 4-17 4-22 0zM1 13v6c0 5 22 5 22 0v-6c-5 4-17 4-22 0z"/></g><text x="120" y="429" font-family="Arial" font-size="17" font-weight="700" fill="#18344f">6 / Parallel gold</text><text x="70" y="467" font-family="Arial" font-size="13" fill="#52657a">One complaint per wide-gold and star fact row</text><text x="70" y="490" font-family="Arial" font-size="13" fill="#52657a">Shared 18 additive count flags</text><text x="70" y="513" font-family="Arial" font-size="13" fill="#52657a">Star facts reconcile to wide-gold totals</text><rect x="500" y="385" width="400" height="165" rx="16" fill="white" stroke="#c5d1dc"/><rect x="518" y="405" width="38" height="38" rx="10" fill="#147d83"/><g transform="translate(525,413)" fill="white"><ellipse cx="12" cy="3" rx="11" ry="3"/><path d="M1 3v6c0 5 22 5 22 0V3c-5 4-17 4-22 0zM1 13v6c0 5 22 5 22 0v-6c-5 4-17 4-22 0z"/></g><text x="570" y="429" font-family="Arial" font-size="17" font-weight="700" fill="#18344f">5 / Silver relationships</text><text x="520" y="467" font-family="Arial" font-size="13" fill="#52657a">Eight relational tables + tag bridge</text><text x="520" y="490" font-family="Arial" font-size="13" fill="#52657a">Stable category keys from JSON values</text><text x="520" y="513" font-family="Arial" font-size="13" fill="#52657a">Tag filters must not multiply complaints</text><rect x="950" y="385" width="400" height="165" rx="16" fill="white" stroke="#c5d1dc"/><rect x="968" y="405" width="38" height="38" rx="10" fill="#147d83"/><g transform="translate(975,413)" fill="white"><ellipse cx="12" cy="3" rx="11" ry="3"/><path d="M1 3v6c0 5 22 5 22 0V3c-5 4-17 4-22 0zM1 13v6c0 5 22 5 22 0v-6c-5 4-17 4-22 0z"/></g><text x="1020" y="429" font-family="Arial" font-size="17" font-weight="700" fill="#18344f">4 / Typed staging</text><text x="970" y="467" font-family="Arial" font-size="13" fill="#52657a">Trim categories; parse dates and timeliness</text><text x="970" y="490" font-family="Arial" font-size="13" fill="#52657a">Preserve nonblank customer narratives</text><text x="970" y="513" font-family="Arial" font-size="13" fill="#52657a">No additional date filtering in staging</text><rect x="50" y="635" width="400" height="165" rx="16" fill="white" stroke="#c5d1dc"/><rect x="68" y="655" width="38" height="38" rx="10" fill="#147d83"/><g transform="translate(75,663)" fill="white"><ellipse cx="12" cy="3" rx="11" ry="3"/><path d="M1 3v6c0 5 22 5 22 0V3c-5 4-17 4-22 0zM1 13v6c0 5 22 5 22 0v-6c-5 4-17 4-22 0z"/></g><text x="120" y="679" font-family="Arial" font-size="17" font-weight="700" fill="#18344f">7 / Export gate</text><text x="70" y="717" font-family="Arial" font-size="13" fill="#52657a">Four independent daily aggregate grains</text><text x="70" y="740" font-family="Arial" font-size="13" fill="#52657a">Each flag total matches wide gold exactly</text><text x="70" y="763" font-family="Arial" font-size="13" fill="#52657a">Reject serving files at or above 90 MiB</text><rect x="500" y="635" width="400" height="165" rx="16" fill="white" stroke="#c5d1dc"/><rect x="518" y="655" width="38" height="38" rx="10" fill="#147d83"/><g transform="translate(525,663)" fill="white"><ellipse cx="12" cy="3" rx="11" ry="3"/><path d="M1 3v6c0 5 22 5 22 0V3c-5 4-17 4-22 0zM1 13v6c0 5 22 5 22 0v-6c-5 4-17 4-22 0z"/></g><text x="570" y="679" font-family="Arial" font-size="17" font-weight="700" fill="#18344f">8 / Release boundary</text><text x="520" y="717" font-family="Arial" font-size="13" fill="#52657a">Stage all files + source / validation manifest</text><text x="520" y="740" font-family="Arial" font-size="13" fill="#52657a">Commit on release branch; PR; merge commit</text><text x="520" y="763" font-family="Arial" font-size="13" fill="#52657a">Failure before merge preserves serving data</text><rect x="950" y="635" width="400" height="165" rx="16" fill="white" stroke="#c5d1dc"/><rect x="968" y="655" width="38" height="38" rx="10" fill="#147d83"/><g transform="translate(975,663)" fill="white"><ellipse cx="12" cy="3" rx="11" ry="3"/><path d="M1 3v6c0 5 22 5 22 0V3c-5 4-17 4-22 0zM1 13v6c0 5 22 5 22 0v-6c-5 4-17 4-22 0z"/></g><text x="1020" y="679" font-family="Arial" font-size="17" font-weight="700" fill="#18344f">9 / Dashboard contract</text><text x="970" y="717" font-family="Arial" font-size="13" fill="#52657a">Parameterized DuckDB queries; shared filters</text><text x="970" y="740" font-family="Arial" font-size="13" fill="#52657a">Cache key includes file mtime and size</text><text x="970" y="763" font-family="Arial" font-size="13" fill="#52657a">K/M/B display; exact CSV download values</text><text x="50" y="840" font-family="Arial" font-size="13" fill="#687e91">Full rebuild on changed revision · Source caches are not durable storage · AI SQL/retrieval contracts remain planned</text></svg>