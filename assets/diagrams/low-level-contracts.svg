<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1170" viewBox="0 0 1440 1170" role="img" aria-labelledby="title desc"><title id="title">Low-level design | contracts, keys and metric logic</title><desc id="desc">Actual schemas and field-level rules; complaint grain remains unchanged throughout the pipeline.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#71859e"/></marker></defs><rect width="1440" height="1170" rx="22" fill="#f8fafc"/><rect width="1440" height="108" rx="22" fill="#132640"/><rect y="85" width="1440" height="23" fill="#132640"/><text x="42" y="43" font-family="Arial,Helvetica,sans-serif" font-size="27" fill="#ffffff" font-weight="700">Low-level design | contracts, keys and metric logic</text><text x="42" y="77" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#b8ccdf" font-weight="400">Actual schemas and field-level rules; complaint grain remains unchanged throughout the pipeline.</text><rect x="32" y="132" width="1376" height="445" rx="20" fill="#edf2f8" stroke="#e1e8f1" stroke-width="1.5"/><text x="54" y="163" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#132640" font-weight="700">01  TRANSFORMATION CONTRACTS</text><text x="54" y="185" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#60748b" font-weight="400">The original bronze inputs are retained. Optional missing values remain explicit.</text><rect x="62" y="213" width="278" height="312" rx="14" fill="#ffffff" stroke="#416bd8" stroke-width="1.5"/><rect x="63" y="214" width="276" height="5" rx="2" fill="#416bd8"/><text x="82" y="243" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#416bd8" font-weight="700">MAIN · BRONZE VIEW</text><text x="82" y="272" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#132640" font-weight="700">Source contract</text><text x="82" y="295" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#203650" font-weight="400">Original 16 CSV fields</text><text x="82" y="316" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#203650" font-weight="400">Complaint ID and ZIP as text</text><text x="82" y="337" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#203650" font-weight="400"></text><text x="82" y="358" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#203650" font-weight="400">Provenance:</text><text x="82" y="379" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#203650" font-weight="400">_source_archive</text><text x="82" y="400" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#203650" font-weight="400">_source_csv</text><text x="82" y="421" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#203650" font-weight="400">_source_record_number</text><text x="82" y="442" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#203650" font-weight="400">_ingested_at</text><rect x="398" y="213" width="278" height="312" rx="14" fill="#ffffff" stroke="#0c8c83" stroke-width="1.5"/><rect x="399" y="214" width="276" height="5" rx="2" fill="#0c8c83"/><text x="418" y="243" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#0c8c83" font-weight="700">MAIN_STAGING</text><text x="418" y="272" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#132640" font-weight="700">Cleaning contract</text><text x="418" y="295" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#203650" font-weight="400">ISO or MM/DD/YYYY dates</text><text x="418" y="316" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#203650" font-weight="400">Categorical whitespace trimmed</text><text x="418" y="337" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#203650" font-weight="400">Optional empty strings → NULL</text><text x="418" y="358" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#203650" font-weight="400">Yes / No → true / false</text><text x="418" y="379" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#203650" font-weight="400">Nonblank narrative preserved</text><text x="418" y="400" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#203650" font-weight="400"></text><text x="418" y="421" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#203650" font-weight="400">Stable keys:</text><text x="418" y="442" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#203650" font-weight="400">MD5(JSON(value list))</text><rect x="734" y="213" width="278" height="312" rx="14" fill="#ffffff" stroke="#0c8c83" stroke-width="1.5"/><rect x="735" y="214" width="276" height="5" rx="2" fill="#0c8c83"/><text x="754" y="243" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#0c8c83" font-weight="700">MAIN_SILVER</text><text x="754" y="272" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#132640" font-weight="700">Relational contract</text><text x="754" y="295" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#203650" font-weight="400">complaints: unique source ID</text><text x="754" y="316" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#203650" font-weight="400">company / product / issue keys</text><text x="754" y="337" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#203650" font-weight="400">submission channel relationship</text><text x="754" y="358" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#203650" font-weight="400">optional narrative: 0 or 1</text><text x="754" y="379" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#203650" font-weight="400">tags: multiple per complaint</text><text x="754" y="400" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#203650" font-weight="400"></text><text x="754" y="421" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#203650" font-weight="400">No sampling or date exclusion</text><text x="754" y="442" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#203650" font-weight="400">ZIP masking retained</text><rect x="1070" y="213" width="306" height="312" rx="14" fill="#ffffff" stroke="#a67c21" stroke-width="1.5"/><rect x="1071" y="214" width="304" height="5" rx="2" fill="#a67c21"/><text x="1090" y="243" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#a67c21" font-weight="700">MAIN_GOLD + MAIN_STAR</text><text x="1090" y="272" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#132640" font-weight="700">Business contract</text><text x="1090" y="295" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#203650" font-weight="400">1 fact row = 1 complaint</text><text x="1090" y="316" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#203650" font-weight="400">Flags: integer 0 or 1</text><text x="1090" y="337" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#203650" font-weight="400">Date grain chosen at query time</text><text x="1090" y="358" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#203650" font-weight="400">Received + sent calendar roles</text><text x="1090" y="379" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#203650" font-weight="400"></text><text x="1090" y="400" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#203650" font-weight="400">Wide and star totals reconcile</text><text x="1090" y="421" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#203650" font-weight="400">Narrative view is shared evidence</text><text x="1090" y="442" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#203650" font-weight="400">No response-event history inferred</text><path d="M340 359 L398 359" fill="none" stroke="#71859e" stroke-width="2" marker-end="url(#arrow)"/><path d="M676 359 L734 359" fill="none" stroke="#71859e" stroke-width="2" marker-end="url(#arrow)"/><path d="M1012 359 L1070 359" fill="none" stroke="#71859e" stroke-width="2" marker-end="url(#arrow)"/><rect x="32" y="610" width="672" height="278" rx="20" fill="#edf2f8" stroke="#e1e8f1" stroke-width="1.5"/><text x="54" y="641" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#132640" font-weight="700">02  METRIC ALGEBRA</text><text x="54" y="663" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#60748b" font-weight="400">Sum numerators and denominators before calculating a rate.</text><text x="62" y="701" font-family="Arial,Helvetica,sans-serif" font-size="20" fill="#132640" font-weight="700">Complaint volume = Σ complaint_count</text><text x="62" y="746" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#0c8c83" font-weight="700">Timely rate = 100 × Σ timely / Σ known timeliness</text><text x="62" y="791" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#0c8c83" font-weight="700">Narrative coverage = 100 × Σ narratives / Σ complaints</text><text x="62" y="837" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#60748b" font-weight="400">Zero denominator → NULL. Timeliness ≠ response outcome.</text><rect x="736" y="610" width="672" height="278" rx="20" fill="#edf2f8" stroke="#e1e8f1" stroke-width="1.5"/><text x="758" y="641" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#132640" font-weight="700">03  VALIDATION CONTRACT</text><text x="758" y="663" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#60748b" font-weight="400">Assertions return violating rows; an empty result passes.</text><text x="766" y="693" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#203650" font-weight="400">✓  Unique IDs + non-NULL required fields</text><text x="766" y="727" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#203650" font-weight="400">✓  Valid dimension links + product/issue consistency</text><text x="766" y="761" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#203650" font-weight="400">✓  Preserved complaint and narrative counts</text><text x="766" y="795" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#203650" font-weight="400">✓  Binary flags + complete outcome partitions</text><text x="766" y="829" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#203650" font-weight="400">✓  Star/wide row and metric-total reconciliation</text><rect x="32" y="922" width="1376" height="158" rx="20" fill="#edf2f8" stroke="#e1e8f1" stroke-width="1.5"/><text x="54" y="953" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#132640" font-weight="700">04  PLANNED AGENT TOOL BOUNDARY</text><text x="54" y="975" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#60748b" font-weight="400">These tool contracts are design proposals, not deployed functions.</text><text x="62" y="1001" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#132640" font-weight="700">SQL tool: structure + filters → validated query → tabular results</text><text x="62" y="1036" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#132640" font-weight="700">Evidence tool: question + same filters → complaint IDs + supporting narrative text</text><text x="42" y="1113" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#60748b" font-weight="400">SEMANTICS  days_to_send_to_company measures receipt-to-referral days; it is not company resolution time.</text><text x="42" y="1145" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#60748b" font-weight="700">FINANCIAL COMPLAINT INTELLIGENCE  /  DESIGN BASELINE · 04 OCT 2026</text></svg>