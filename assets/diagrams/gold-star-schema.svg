ly="Arial,Helvetica,sans-serif" font-size="19" fill="#132640" font-weight="700">dim_response</text><text x="1060" y="749" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#203650" font-weight="400">response_id  [PK]</text><text x="1060" y="770" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#203650" font-weight="400">outcome + public category</text><text x="1060" y="791" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#203650" font-weight="400">timeliness</text><rect x="486" y="306" width="468" height="570" rx="14" fill="#ffffff" stroke="#a67c21" stroke-width="1.5"/><rect x="487" y="307" width="466" height="5" rx="2" fill="#a67c21"/><text x="506" y="336" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#a67c21" font-weight="700">FACT · 14,482,997 ROWS</text><text x="506" y="365" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#132640" font-weight="700">fact_complaints</text><text x="506" y="388" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#203650" font-weight="400">complaint_id  [PK]</text><text x="506" y="409" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#203650" font-weight="400"></text><text x="506" y="430" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#203650" font-weight="400">Foreign keys:</text><text x="506" y="451" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#203650" font-weight="400">company_id · product_category_id</text><text x="506" y="472" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#203650" font-weight="400">issue_category_id</text><text x="506" y="493" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#203650" font-weight="400">submission_channel_id</text><text x="506" y="514" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#203650" font-weight="400">geography_id · response_id</text><text x="506" y="535" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#203650" font-weight="400">received_date_key · sent_date_key</text><text x="506" y="556" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#203650" font-weight="400"></text><text x="506" y="577" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#203650" font-weight="400">Additive measures:</text><text x="506" y="598" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#203650" font-weight="400">complaint_count · narrative_count</text><text x="506" y="619" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#203650" font-weight="400">timely_response_count</text><text x="506" y="640" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#203650" font-weight="400">known_timeliness_count</text><text x="506" y="661" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#203650" font-weight="400">response outcome + quality flags</text><text x="506" y="682" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#203650" font-weight="400"></text><text x="506" y="703" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#203650" font-weight="400">days_to_send_to_company</text><path d="M486 360 L450 360 L450 264 L400 264" fill="none" stroke="#71859e" stroke-width="2" marker-end="url(#arrow)"/><path d="M486 466 L400 466" fill="none" stroke="#71859e" stroke-width="2" marker-end="url(#arrow)"/><path d="M486 668 L400 668" fill="none" stroke="#71859e" stroke-width="2" marker-end="url(#arrow)"/><path d="M486 785 L450 785 L450 870 L400 870" fill="none" stroke="#71859e" stroke-width="2" marker-end="url(#arrow)"/><path d="M954 360 L995 360 L995 253 L1040 253" fill="none" stroke="#71859e" stroke-width="2" marker-end="url(#arrow)"/><text x="964" y="240" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#60748b" font-weight="400">received date</text><path d="M954 394 L1015 394 L1015 310 L1040 310" fill="none" stroke="#71859e" stroke-width="2" marker-end="url(#arrow)"/><text x="964" y="417" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#60748b" font-weight="400">sent date</text><path d="M954 499 L1040 499" fill="none" stroke="#71859e" stroke-width="2" marker-end="url(#arrow)"/><path d="M954 736 L1040 736" fill="none" stroke="#71859e" stroke-width="2" marker-end="url(#arrow)"/><rect x="32" y="985" width="1376" height="150" rx="20" fill="#edf2f8" stroke="#e1e8f1" stroke-width="1.5"/><text x="54" y="1016" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#132640" font-weight="700">MODELING NOTES</text><text x="54" y="1038" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#60748b" font-weight="400">PK/FK labels are logical relationships validated by dbt, not enforced DuckDB DDL constraints.</text><text x="62" y="1067" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#203650" font-weight="400">Narratives and complaint–tag links remain shared supporting tables. No dimension-to-dimension joins are required.</text><text x="62" y="1100" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#60748b" font-weight="400">The fact reuses wide-gold flags. Benchmarking will compare query representation, not independent metric implementations.</text><text x="42" y="1205" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#60748b" font-weight="700">FINANCIAL COMPLAINT INTELLIGENCE  /  DESIGN BASELINE · 04 OCT 2026</text></svg>