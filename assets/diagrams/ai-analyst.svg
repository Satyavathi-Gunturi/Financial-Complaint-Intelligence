ETERS</text><text x="635" y="605" font-family="Arial, sans-serif" font-size="13" fill="#40566C" font-weight="400">Global filters cannot be silently expanded</text><text x="635" y="628" font-family="Arial, sans-serif" font-size="13" fill="#40566C" font-weight="400">No writes, joins, code or arbitrary files</text><text x="635" y="651" font-family="Arial, sans-serif" font-size="13" fill="#40566C" font-weight="400">History resets on filter / release changes</text><rect x="55" y="755" width="460" height="195" rx="12" fill="#FFFFFF" stroke="#C1CFDD" stroke-width="1.5"/><rect x="55" y="769" width="5" height="167" rx="2" fill="#3466AC"/><rect x="71" y="773" width="54" height="54" rx="10" fill="#EEF3F8" stroke="#EEF3F8" stroke-width="1.5"/><g transform="translate(76,778)"><svg xmlns="http://www.w3.org/2000/svg" width="44" height="44" viewBox="0 0 44 44"><g fill="#3466AC" color="#3466AC"><path d="M5 8h25v31H5z"/><path d="M13 3h22l6 7v24h-8V15H13z"/><path d="M11 19h12m-12 7h12m-12 6h9" fill="none" stroke="white" stroke-width="2"/></g></svg></g><text x="137" y="790" font-family="Arial, sans-serif" font-size="17" fill="#122B45" font-weight="700">Business knowledge</text><text x="137" y="810" font-family="Arial, sans-serif" font-size="11" fill="#3466AC" font-weight="700">VERSIONED / REPOSITORY DOCUMENTS</text><text x="75" y="855" font-family="Arial, sans-serif" font-size="13" fill="#40566C" font-weight="400">Glossary + metric definitions + CFPB sources</text><text x="75" y="878" font-family="Arial, sans-serif" font-size="13" fill="#40566C" font-weight="400">Refresh and narrative limitations</text><text x="75" y="901" font-family="Arial, sans-serif" font-size="13" fill="#40566C" font-weight="400">Document results include source links</text><text x="75" y="924" font-family="Arial, sans-serif" font-size="13" fill="#40566C" font-weight="400">Read fixed documents from current checkout</text><rect x="615" y="755" width="470" height="195" rx="12" fill="#FFFFFF" stroke="#C1CFDD" stroke-width="1.5"/><rect x="615" y="769" width="5" height="167" rx="2" fill="#B47A13"/><rect x="631" y="773" width="54" height="54" rx="10" fill="#EEF3F8" stroke="#EEF3F8" stroke-width="1.5"/><g transform="translate(636,778)"><svg xmlns="http://www.w3.org/2000/svg" width="44" height="44" viewBox="0 0 44 44"><g fill="#B47A13" color="#B47A13"><ellipse cx="22" cy="10" rx="16" ry="6"/><path d="M6 10v23c0 8 32 8 32 0V10c-8 7-24 7-32 0z"/><path d="M7 21c8 6 22 6 30 0" fill="none" stroke="white" stroke-width="2"/></g></svg></g><text x="697" y="790" font-family="Arial, sans-serif" font-size="17" fill="#122B45" font-weight="700">Read-only aggregate queries</text><text x="697" y="810" font-family="Arial, sans-serif" font-size="11" fill="#B47A13" font-weight="700">DUCKDB / ONE SERVING GRAIN</text><text x="635" y="855" font-family="Arial, sans-serif" font-size="13" fill="#40566C" font-weight="400">Overview, issue, state or channel Parquet</text><text x="635" y="878" font-family="Arial, sans-serif" font-size="13" fill="#40566C" font-weight="400">SUM(flags); divide summed rate components</text><text x="635" y="901" font-family="Arial, sans-serif" font-size="13" fill="#40566C" font-weight="400">Parameterized labels and narrow date bounds</text><text x="635" y="924" font-family="Arial, sans-serif" font-size="13" fill="#40566C" font-weight="400">256 MB / 15 seconds / 50 result rows</text><rect x="1180" y="755" width="460" height="195" rx="12" fill="#FFFFFF" stroke="#C1CFDD" stroke-width="1.5"/><rect x="1180" y="769" width="5" height="167" rx="2" fill="#7555A1"/><rect x="1196" y="773" width="54" height="54" rx="10" fill="#EEF3F8" stroke="#EEF3F8" stroke-width="1.5"/><g transform="translate(1201,778)"><svg xmlns="http://www.w3.org/2000/svg" width="44" height="44" viewBox="0 0 44 44"><g fill="#7555A1" color="#7555A1"><circle cx="18" cy="18" r="13"/><path d="m27 27 13 13" fill="none" stroke="currentColor" stroke-width="7"/><circle cx="18" cy="18" r="8" fill="white"/></g></svg></g><text x="1262" y="790" font-family="Arial, sans-serif" font-size="17" fill="#122B45" font-weight="700">Public complaint evidence</text><text x="1262" y="810" font-family="Arial, sans-serif" font-size="11" fill="#7555A1" font-weight="700">PARQUET / SAMPLED NARRATIVES</text><text x="1200" y="855" font-family="Arial, sans-serif" font-size="13" fill="#40566C" font-weight="400">Literal phrase + optional recorded issue</text><text x="1200" y="878" font-family="Arial, sans-serif" font-size="13" fill="#40566C" font-weight="400">Up to eight excerpts + complaint IDs</text><text x="1200" y="901" font-family="Arial, sans-serif" font-size="13" fill="#40566C" font-weight="400">Overview hash must match the evidence</text><text x="1200" y="924" font-family="Arial, sans-serif" font-size="13" fill="#40566C" font-weight="400">Up to 60K sample; no extrapolation</text><path d="M435 340 L575 340" fill="none" stroke="#63758A" stroke-width="2" marker-end="url(#arrow)"/><text x="468" y="323" font-family="Arial, sans-serif" font-size="11" fill="#63758A" font-weight="400">Question</text><path d="M1125 325 L1270 325" fill="none" stroke="#63758A" stroke-width="2" marker-end="url(#arrow)"/><text x="1128" y="301" font-family="Arial, sans-serif" font-size="11" fill="#63758A" font-weight="400">Context / results</text><path d="M1450 435 L1450 470 L1135 470 L1135 405 L1125 405" fill="none" stroke="#7555A1" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="6 5"/><text x="1180" y="455" font-family="Arial, sans-serif" font-size="11" fill="#7555A1" font-weight="400">Tool selection / answer</text><path d="M850 435 L850 505" fill="none" stroke="#63758A" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="6 5"/><text x="868" y="476" font-family="Arial, sans-serif" font-size="11" fill="#63758A" font-weight="400">Validate arguments</text><path d="M680 660 L680 700 L285 700 L285 755" fill="none" stroke="#63758A" stroke-width="2" marker-end="url(#arrow)"/><text x="340" y="681" font-family="Arial, sans-seri