<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="1160" viewBox="0 0 1700 1160" role="img"><title>HLSD 02  /  Deployment &amp; operations</title><desc>Execution environments · Ownership, permissions, storage lifetime and recovery</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0 8 4 0 8z" fill="#63758A"/></marker></defs><rect width="1700" height="1160" fill="#F4F7FB"/><rect x="0" y="0" width="1700" height="160" rx="0" fill="#122B45" stroke="#122B45" stroke-width="1.5"/><text x="54" y="44" font-family="Arial, sans-serif" font-size="14" fill="#72D5D0" font-weight="700">FINANCIAL COMPLAINT INTELLIGENCE  /  ENGINEERING DESIGN</text><text x="54" y="100" font-family="Arial, sans-serif" font-size="32" fill="#FFFFFF" font-weight="700">HLSD 02  /  Deployment &amp; operations</text><text x="54" y="129" font-family="Arial, sans-serif" font-size="16" fill="#D9E5F0" font-weight="400">Execution environments · Ownership, permissions, storage lifetime and recovery</text><text x="1290" y="42" font-family="Arial, sans-serif" font-size="12" fill="#D9E5F0" font-weight="400">DESIGN BASELINE  ·  07 OCT 2026</text><text x="54" y="195" font-family="Arial, sans-serif" font-size="14" fill="#63758A" font-weight="400">SCOPE: Runtime boundaries and operational controls; no invented production cloud services</text><rect x="45" y="230" width="755" height="670" rx="16" fill="#EAF0F6" stroke="#BBCAD8" stroke-width="1.5"/><text x="63" y="259" font-family="Arial, sans-serif" font-size="15" fill="#087F8C" font-weight="700">BUILD ENVIRONMENT  /  GITHUB-HOSTED UBUNTU</text><text x="63" y="281" font-family="Arial, sans-serif" font-size="12" fill="#63758A" font-weight="400">Execution owner: repository workflow</text><rect x="850" y="230" width="805" height="670" rx="16" fill="#EAF0F6" stroke="#BBCAD8" stroke-width="1.5"/><text x="868" y="259" font-family="Arial, sans-serif" font-size="15" fill="#3466AC" font-weight="700">SERVING ENVIRONMENT  /  STREAMLIT COMMUNITY CLOUD</text><text x="868" y="281" font-family="Arial, sans-serif" font-size="12" fill="#63758A" font-weight="400">Deployment source: main branch</text><rect x="75" y="315" width="335" height="185" rx="12" fill="#FFFFFF" stroke="#C1CFDD" stroke-width="1.5"/><rect x="75" y="329" width="5" height="157" rx="2" fill="#087F8C"/><rect x="91" y="333" width="54" height="54" rx="10" fill="#EEF3F8" stroke="#EEF3F8" stroke-width="1.5"/><g transform="translate(96,338)"><svg xmlns="http://www.w3.org/2000/svg" width="44" height="44" viewBox="0 0 44 44"><g fill="#087F8C" color="#087F8C"><path d="M11 7h22l10 15-10 15H11L1 22z"/><path d="M14 22h15m-5-6 6 6-6 6" fill="none" stroke="white" stroke-width="3"/></g></svg></g><text x="157" y="350" font-family="Arial, sans-serif" font-size="17" fill="#122B45" font-weight="700">Python + dbt runtime</text><text x="157" y="370" font-family="Arial, sans-serif" font-size="11" fill="#087F8C" font-weight="700">COMPUTE / EPHEMERAL RUNNER</text><text x="95" y="415" font-family="Arial, sans-serif" font-size="13" fill="#40566C" font-weight="400">1 dbt thread; 2 GB memory limit</text><text x="95" y="438" font-family="Arial, sans-serif" font-size="13" fill="#40566C" font-weight="400">Temporary spill directory</text><text x="95" y="461" font-family="Arial, sans-serif" font-size="13" fill="#40566C" font-weight="400">12 GiB free-disk preflight</text><text x="95" y="484" font-family="Arial, sans-serif" font-size="13" fill="#40566C" font-weight="400">120-minute workflow timeout</text><rect x="445" y="315" width="325" height="185" rx="12" fill="#FFFFFF" stroke="#C1CFDD" stroke-width="1.5"/><rect x="445" y="329" width="5" height="157" rx="2" fill="#B47A13"/><rect x="461" y="333" width="54" height="54" rx="10" fill="#EEF3F8" stroke="#EEF3F8" stroke-width="1.5"/><g transform="translate(466,338)"><svg xmlns="http://www.w3.org/2000/svg" width="44" height="44" viewBox="0 0 44 44"><g fill="#B47A13" color="#B47A13"><ellipse cx="22" cy="10" rx="16" ry="6"/><path d="M6 10v23c0 8 32 8 32 0V10c-8 7-24 7-32 0z"/><path d="M7 21c8 6 22 6 30 0" fill="none" stroke="white" stroke-width="2"/></g></svg></g><text x="527" y="350" font-family="Arial, sans-serif" font-size="17" fill="#122B45" font-weight="700">Working data</text><text x="527" y="370" font-family="Arial, sans-serif" font-size="11" fill="#B47A13" font-weight="700">STORAGE / RUNNER FILESYSTEM</text><text x="465" y="415" font-family="Arial, sans-serif" font-size="13" fill="#40566C" font-weight="400">data/source_cache: disposable ZIPs</text><text x="465" y="438" font-family="Arial, sans-serif" font-size="13" fill="#40566C" font-weight="400">data/refresh_work: bronze + DB</text><text x="465" y="461" font-family="Arial, sans-serif" font-size="13" fill="#40566C" font-weight="400">data/release: staged outputs</text><text x="465" y="484" font-family="Arial, sans-serif" font-size="13" fill="#40566C" font-weight="400">No permanent detailed-data API</text><rect x="75" y="565" width="335" height="160" rx="12" fill="#FFFFFF" stroke="#C1CFDD" stroke-width="1.5"/><rect x="75" y="579" width="5" height="132" rx="2" fill="#3466AC"/><rect x="91" y="583" width="54" height="54" rx="10" fill="#EEF3F8" stroke="#EEF3F8" stroke-width="1.5"/><g transform="translate(96,588)"><svg xmlns="http://www.w3.org/2000/svg" width="44" height="44" viewBox="0 0 44 44"><g fill="#3466AC" color="#3466AC"><path d="M22 3 39 9v12c0 11-8 17-17 21C13 38 5 32 5 21V9z"/><path d="m12 22 7 7 13-15" fill="none" stroke="white" stroke-width="3"/></g></svg></g><text x="157" y="600" font-family="Arial, sans-serif" font-size="17" fill="#122B45" font-weight="700">Publication identity</text><text x="157" y="620" font-family="Arial, sans-serif" font-size="11" fill="#3466AC" font-weight="700">CONTROL / GITHUB_TOKEN</text><text x="95" y="665" font-family="Arial, sans-serif" font-size="13" fill="#40566C" font-weight="400">contents + pull-requests: write</text><text x="95" y="688" font-family="Arial, sans-serif" font-size="13" fill="#40566C" font-weight="400">Repository rules remain authoritative</text><text x="95" y="711" font-family="Arial, sans-serif" font-size="13" fill="#40566C" font-weight="400">Bot PR may await required review</text><rect x="445" y="565" width="325" height="160" rx="12" fill="#FFFFFF" stroke="#C1CFDD" stroke-width="1.5"/><rect x="445" y="579" width="5" height="132" rx="2" fill="#7555A1"/><rect x="461" y="583" width="54" height="54" rx="10" fill="#EEF3F8" stroke="#EEF3F8" stroke-width="1.5"/><g transform="translate(466,588)"><svg xmlns="http://www.w3.org/2000/svg" width="44" height="44" viewBox="0 0 44 44"><g fill="#7555A1" color="#7555A1"><path d="M8 3h21l9 10v28H8z"/><path d="M28 3v12h10M14 22h18m-18 7h18m-18 7h12" fill="none" stroke="white" stroke-width="2"/></g></svg></g><text x="527" y="600" font-family="Arial, sans-serif" font-size="17" fill="#122B45" font-weight="700">Execution evidence</text><text x="527" y="620" font-family="Arial, sans-serif" font-size="11" fill="#7555A1" font-weight="700">ARTIFACT / ACTIONS LOGS</text><text x="465" y="665" font-family="Arial, sans-serif" font-size="13" fill="#40566C" font-weight="400">dbt results, manifest and build log</text><text x="465" y="688" font-family="Arial, sans-serif" font-size="13" fill="#40566C" font-weight="400">14-day artifact retention</text><text x="465" y="711" font-family="Arial, sans-serif" font-size="13" fill="#40566C" font-weight="400">Source failure stops publication</text><rect x="890" y="315" width="335" height="185" rx="12" fill="#FFFFFF" stroke="#C1CFDD" stroke-width="1.5"/><rect x="890" y="329" width="5" height="157" rx="2" fill="#3466AC"/><rect x="906" y="333" width="54" height="54" rx="10" fill="#EEF3F8" stroke="#EEF3F8" stroke-width="1.5"/><g transform="translate(911,338)"><svg xmlns="http://www.w3.org/2000/svg" width="44" height="44" viewBox="0 0 44 44"><g fill="#3466AC" color="#3466AC"><path d="M11 10v24m0-12h15c6 0 7-5 7-10" fill="none" stroke="currentColor" stroke-width="6"/><circle cx="11" cy="7" r="6"/><circle cx="11" cy="36" r="6"/><circle cx="33" cy="7" r="6"/></g></svg></g><text x="972" y="350" font-family="Arial, sans-serif" font-size="17" fill="#122B45" font-weight="700">Main release revision</text><text x="972" y="370" font-family="Arial, sans-serif" font-size="11" fill="#3466AC" font-weight="700">FILES / GITHUB REPOSITORY</text><text x="910" y="415" font-family="Arial, sans-serif" font-size="13" fill="#40566C" font-weight="400">Four aggregates + narrative sample</text><text x="910" y="438" font-family="Arial, sans-serif" font-size="13" fill="#40566C" font-weight="400">reports/refresh_manifest.json</text><text x="910" y="461" font-family="Arial, sans-serif" font-size="13" fill="#40566C" font-weight="400">Merge commit retains release history</text><text x="910" y="484" font-family="Arial, sans-serif" font-size="13" fill="#40566C" font-weight="400">Large databases are not committed</text><rect x="1260" y="315" width="355" height="185" rx="12" fill="#FFFFFF" stroke="#C1CFDD" stroke-width="1.5"/><rect x="1260" y="329" width="5" height="157" rx="2" fill="#087F8C"/><rect x="1276" y="333" width="54" height="54" rx="10" fill="#EEF3F8" stroke="#EEF3F8" stroke-width="1.5"/><g transform="translate(1281,338)"><svg xmlns="http://www.w3.org/2000/svg" width="44" height="44" viewBox="0 0 44 44"><g fill="#087F8C" color="#087F8C"><rect x="3" y="5" width="38" height="32" rx="4"/><path d="M7 12h30M14 33V23m8 10V17m8 16V21" fill="none" stroke="white" stroke-width="3"/></g></svg></g><text x="1342" y="350" font-family="Arial, sans-serif" font-size="17" fill="#122B45" font-weight="700">Streamlit app process</text><text x="1342" y="370" font-family="Arial, sans-serif" font-size="11" fill="#087F8C" font-weight="700">APPLICATION / PYTHON</text><text x="1280" y="415" font-family="Arial, sans-serif" font-size="13" fill="#40566C" font-weight="400">dashboard/app.py</text><text x="1280" y="438" font-family="Arial, sans-serif" font-size="13" fill="#40566C" font-weight="400">Read five Parquets with DuckDB</text><text x="1280" y="461" font-family="Arial, sans-serif" font-size="13" fill="#40566C" font-weight="400">Parameterized filters and queries</text><text x="1280" y="484" font-family="Arial, sans-serif" font-size="13" fill="#40566C" font-weight="400">Local NLP + optional Gemini analyst</text><rect x="890" y="565" width="335" height="160" rx="12" fill="#FFFFFF" stroke="#C1CFDD" stroke-width="1.5"/><rect x="890" y="579" width="5" height="132" rx="2" fill="#087F8C"/><rect x="906" y="583" width="54" height="54" rx="10" fill="#EEF3F8" stroke="#EEF3F8" stroke-width="1.5"/><g transform="translate(911,588)"><svg xmlns="http://www.w3.org/2000/svg" width="44" height="44" viewBox="0 0 44 44"><g fill="#087F8C" color="#087F8C"><ellipse cx="22" cy="10" rx="16" ry="6"/><path d="M6 10v23c0 8 32 8 32 0V10c-8 7-24 7-32 0z"/><path d="M7 21c8 6 22 6 30 0" fill="none" stroke="white" stroke-width="2"/></g></svg></g><text x="972" y="600" font-family="Arial, sans-serif" font-size="17" fill="#122B45" font-weight="700">Serving query cache</text><text x="972" y="620" font-family="Arial, sans-serif" font-size="11" fill="#087F8C" font-weight="700">MEMORY / STREAMLIT CACHE</text><text x="910" y="665" font-family="Arial, sans-serif" font-size="13" fill="#40566C" font-weight="400">Key includes file mtime + size</text><text x="910" y="688" font-family="Arial, sans-serif" font-size="13" fill="#40566C" font-weight="400">Independent queries per grain</text><text x="910" y="711" font-family="Arial, sans-serif" font-size="13" fill="#40566C" font-weight="400">Rates computed from summed flags</text><rect x="1260" y="565" width="355" height="160" rx="12" fill="#FFFFFF" stroke="#C1CFDD" stroke-width="1.5"/><rect x="1260" y="579" width="5" height="132" rx="2" fill="#3466AC"/><rect x="1276" y="583" width="54" height="54" rx="10" fill="#EEF3F8" stroke="#EEF3F8" stroke-width="1.5"/><g transform="translate(1281,588)"><svg xmlns="http://www.w3.org/2000/svg" width="44" height="44" viewBox="0 0 44 44"><g fill="#3466AC" color="#3466AC"><circle cx="22" cy="12" r="8"/><path d="M6 40v-7c0-16 32-16 32 0v7z"/></g></svg></g><text x="1342" y="600" font-family="Arial, sans-serif" font-size="17" fill="#122B45" font-weight="700">Leadership &amp; analysts</text><text x="1342" y="620" font-family="Arial, sans-serif" font-size="11" fill="#3466AC" font-weight="700">PERSON / WEB BROWSER</text><text x="1280" y="665" font-family="Arial, sans-serif" font-size="13" fill="#40566C" font-weight="400">Eight tabs + optional Gemini analyst</text><text x="1280" y="688" font-family="Arial, sans-serif" font-size="13" fill="#40566C" font-weight="400">K/M/B counts and hover labels</text><text x="1280" y="711" font-family="Arial, sans-serif" font-size="13" fill="#40566C" font-weight="400">Exact-value CSV downloads</text><path d="M410 405 L445 405" fill="none" stroke="#63758A" stroke-width="2" marker-end="url(#arrow)"/><text x="414" y="394" font-family="Arial, sans-serif" font-size="11" fill="#63758A" font-weight="400">I/O</text><path d="M245 500 L245 530 L608 530 L608 565" fill="none" stroke="#63758A" stroke-width="2" marker-end="url(#arrow)"/><text x="355" y="520" font-family="Arial, sans-serif" font-size="11" fill="#63758A" font-weight="400">Build results + log files</text><path d="M1225 405 L1260 405" fill="none" stroke="#63758A" stroke-width="2" marker-end="url(#arrow)"/><text x="1228" y="392" font-family="Arial, sans-serif" font-size="11" fill="#63758A" font-weight="400">Checkout</text><path d="M1438 500 L1438 537 L1058 537 L1058 565" fill="none" stroke="#63758A" stroke-width="2" marker-end="url(#arrow)"/><text x="1110" y="527" font-family="Arial, sans-serif" font-size="11" fill="#63758A" font-weight="400">DuckDB read / cache identity</text><path d="M1438 500 L1575 500 L1575 565" fill="none" stroke="#63758A" stroke-width="2" marker-end="url(#arrow)"/><text x="1490" y="541" font-family="Arial, sans-serif" font-size="11" fill="#63758A" font-weight="400">HTTPS UI</text><rect x="75" y="770" width="695" height="105" rx="14" fill="#FFFFFF" stroke="#C1CFDD" stroke-width="1.5"/><text x="93" y="798" font-family="Arial, sans-serif" font-size="14" fill="#B84C48" font-weight="700">FAILURE / RECOVERY</text><text x="93" y="824" font-family="Arial, sans-serif" font-size="12" fill="#63758A" font-weight="400">Any download, schema, dbt or export failure retains last good data.</text><text x="93" y="845" font-family="Arial, sans-serif" font-size="12" fill="#63758A" font-weight="400">Main-branch runs supersede older runs; inspect Actions failures.</text><text x="93" y="866" font-family="Arial, sans-serif" font-size="12" fill="#63758A" font-weight="400">Colab + Drive complete checkpoint is a separate manual recovery path.</text><rect x="890" y="770" width="725" height="105" rx="14" fill="#FFFFFF" stroke="#C1CFDD" stroke-width="1.5"/><text x="908" y="798" font-family="Arial, sans-serif" font-size="14" fill="#7555A1" font-weight="700">SERVICE LIMITS</text><text x="908" y="824" font-family="Arial, sans-serif" font-size="12" fill="#63758A" font-weight="400">Daily checks do not guarantee monthly CFPB releases or live coverage.</text><text x="908" y="845" font-family="Arial, sans-serif" font-size="12" fill="#63758A" font-weight="400">GITHUB_TOKEN bot PRs do not trigger independent PR Actions checks.</text><text x="908" y="866" font-family="Arial, sans-serif" font-size="12" fill="#63758A" font-weight="400">No freshness SLA, automated alerting or DR target is claimed.</text><rect x="45" y="945" width="1610" height="120" rx="14" fill="#FFFFFF" stroke="#C1CFDD" stroke-width="1.5"/><text x="63" y="973" font-family="Arial, sans-serif" font-size="14" fill="#B47A13" font-weight="700">ARCHITECTURE DECISIONS / TRADE-OFFS</text><text x="63" y="999" font-family="Arial, sans-serif" font-size="12" fill="#63758A" font-weight="400">Full retained-window rebuild favors reproducibility over incremental cost; full-scale runner acceptance remains open.</text><text x="63" y="1020" font-family="Arial, sans-serif" font-size="12" fill="#63758A" font-weight="400">Separate aggregate serving keeps large complaint/narrative databases out of the dashboard deployment.</text><text x="63" y="1041" font-family="Arial, sans-serif" font-size="12" fill="#63758A" font-weight="400">Current source download is blocked by HTTP 403. Durable source versions and hosted AI detail access remain future work.</text><text x="54" y="1107" font-family="Arial, sans-serif" font-size="12" fill="#63758A" font-weight="400">LEGEND  ·  Filled icons = component type  |  Solid cards = implemented  |  Dashed cards = planned</text><text x="54" y="1130" font-family="Arial, sans-serif" font-size="12" fill="#63758A" font-weight="400">Solid arrows = data / publication flow  |  Dashed arrows = control / development flow  |  Processing is batch-based; no streaming or live-backlog service</text></svg>