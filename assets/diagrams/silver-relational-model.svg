<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1240" viewBox="0 0 1440 1240" role="img" aria-labelledby="title desc"><title id="title">Silver relational model | clean records, explicit relationships</title><desc id="desc">Eight shared tables underpin both gold designs; narrative text and multi-valued tags remain separate.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#71859e"/></marker></defs><rect width="1440" height="1240" rx="22" fill="#f8fafc"/><rect width="1440" height="108" rx="22" fill="#132640"/><rect y="85" width="1440" height="23" fill="#132640"/><text x="42" y="43" font-family="Arial,Helvetica,sans-serif" font-size="27" fill="#ffffff" font-weight="700">Silver relational model | clean records, explicit relationships</text><text x="42" y="77" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#b8ccdf" font-weight="400">Eight shared tables underpin both gold designs; narrative text and multi-valued tags remain separate.</text><rect x="60" y="197" width="340" height="133" rx="14" fill="#ffffff" stroke="#416bd8" stroke-width="1.5"/><rect x="61" y="198" width="338" height="5" rx="2" fill="#416bd8"/><text x="80" y="227" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#416bd8" font-weight="700">5,661 ROWS</text><text x="80" y="256" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#132640" font-weight="700">companies</text><text x="80" y="279" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#203650" font-weight="400">company_id  [PK]</text><text x="80" y="300" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#203650" font-weight="400">company_name</text><rect x="60" y="399" width="340" height="133" rx="14" fill="#ffffff" stroke="#416bd8" stroke-width="1.5"/><rect x="61" y="400" width="338" height="5" rx="2" fill="#416bd8"/><text x="80" y="429" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#416bd8" font-weight="700">76 ROWS</text><text x="80" y="458" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#132640" font-weight="700">product_categories</text><text x="80" y="481" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#203650" font-weight="400">product_category_id  [PK]</text><text x="80" y="502" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#203650" font-weight="400">product + sub_product</text><rect x="60" y="601" width="340" height="155" rx="14" fill="#ffffff" stroke="#416bd8" stroke-width="1.5"/><rect x="61" y="602" width="338" height="5" rx="2" fill="#416bd8"/><text x="80" y="631" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#416bd8" font-weight="700">1,945 ROWS</text><text x="80" y="660" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#132640" font-weight="700">issue_categories</text><text x="80" y="683" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#203650" font-weight="400">issue_category_id  [PK]</text><text x="80" y="704" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#203650" font-weight="400">product_category_id  [FK]</text><text x="80" y="725" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#203650" font-weight="400">issue + sub_issue</text><rect x="60" y="803" width="340" height="133" rx="14" fill="#ffffff" stroke="#416bd8" stroke-width="1.5"/><rect x="61" y="804" width="338" height="5" rx="2" fill="#416bd8"/><text x="80" y="833" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#416bd8" font-weight="700">5 ROWS</text><text x="80" y="862" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#132640" font-weight="700">submission_channels</text><text x="80" y="885" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#203650" font-weight="400">submission_channel_id  [PK]</text><text x="80" y="906" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#203650" font-weight="400">submission_channel</text><rect x="486" y="306" width="468" height="570" rx="14" fill="#ffffff" stroke="#0c8c83" stroke-width="1.5"/><rect x="487" y="307" width="466" height="5" rx="2" fill="#0c8c83"/><text x="506" y="336" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#0c8c83" font-weight="700">14,482,997 ROWS</text><text x="506" y="365" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#132640" font-weight="700">complaints</text><text x="506" y="388" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#203650" font-weight="400">complaint_id  [PK]</text><text x="506" y="409" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#203650" font-weight="400"></text><text x="506" y="430" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#203650" font-weight="400">Direct reference keys:</text><text x="506" y="451" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#203650" font-weight="400">company_id</text><text x="506" y="472" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#203650" font-weight="400">product_category_id</text><text x="506" y="493" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#203650" font-weight="400">issue_category_id</text><text x="506" y="514" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#203650" font-weight="400">submission_channel_id</text><text x="506" y="535" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#203650" font-weight="400"></text><text x="506" y="556" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#203650" font-weight="400">Receipt + sending dates</text><text x="506" y="577" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#203650" font-weight="400">State + text ZIP</text><text x="506" y="598" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#203650" font-weight="400">Recorded response categories</text><text x="506" y="619" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#203650" font-weight="400">Timeliness + narrative availability</text><text x="506" y="640" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#203650" font-weight="400"></text><text x="506" y="661" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#203650" font-weight="400">Source archive / CSV</text><text x="506" y="682" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#203650" font-weight="400">Logical source record + ingestion time</text><rect x="1040" y="197" width="340" height="133" rx="14" fill="#ffffff" stroke="#7856bb" stroke-width="1.5"/><rect x="1041" y="198" width="338" height="5" rx="2" fill="#7856bb"/><text x="1060" y="227" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#7856bb" font-weight="700">2,711,935 ROWS</text><text x="1060" y="256" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#132640" font-weight="700">complaint_narratives</text><text x="1060" y="279" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#203650" font-weight="400">complaint_id  [PK / FK]</text><text x="1060" y="300" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#203650" font-weight="400">narrative  [nonblank source text]</text><rect x="1040" y="432" width="340" height="133" rx="14" fill="#ffffff" stroke="#416bd8" stroke-width="1.5"/><rect x="1041" y="433" width="338" height="5" rx="2" fill="#416bd8"/><text x="1060" y="462" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#416bd8" font-weight="700">2 ROWS</text><text x="1060" y="491" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#132640" font-weight="700">tags</text><text x="1060" y="514" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#203650" font-weight="400">tag_id  [PK]</text><text x="1060" y="535" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#203650" font-weight="400">tag_name</text><rect x="1040" y="667" width="340" height="155" rx="14" fill="#ffffff" stroke="#7856bb" stroke-width="1.5"/><rect x="1041" y="668" width="338" height="5" rx="2" fill="#7856bb"/><text x="1060" y="697" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#7856bb" font-weight="700">484,025 ROWS</text><text x="1060" y="726" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#132640" font-weight="700">complaint_tags</text><text x="1060" y="749" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#203650" font-weight="400">complaint_id  [PK / FK]</text><text x="1060" y="770" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#203650" font-weight="400">tag_id  [PK / FK]</text><text x="1060" y="791" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#203650" font-weight="400">Unique complaint–tag pair</text><path d="M486 360 L450 360 L450 264 L400 264" fill="none" stroke="#71859e" stroke-width="2" marker-end="url(#arrow)"/><path d="M486 466 L400 466" fill="none" stroke="#71859e" stroke-width="2" marker-end="url(#arrow)"/><path d="M486 668 L400 668" fill="none" stroke="#71859e" stroke-width="2" marker-end="url(#arrow)"/><path d="M486 785 L450 785 L450 870 L400 870" fill="none" stroke="#71859e" stroke-width="2" marker-end="url(#arrow)"/><path d="M230 601 L230 532" fill="none" stroke="#71859e" stroke-width="2" marker-end="url(#arrow)"/><text x="245" y="578" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#60748b" font-weight="400">product context</text><path d="M954 360 L995 360 L995 264 L1040 264" fill="none" stroke="#71859e" stroke-width="2" marker-end="url(#arrow)"/><text x="1045" y="179" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#60748b" font-weight="400">0 or 1 narrative</text><path d="M1040 736 L954 736" fill="none" stroke="#71859e" stroke-width="2" marker-end="url(#arrow)"/><text x="1080" y="855" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#60748b" font-weight="400">complaint reference</text><path d="M1210 667 L1210 565" fill="none" stroke="#71859e" stroke-width="2" marker-end="url(#arrow)"/><text x="1223" y="618" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#60748b" font-weight="400">tag reference</text><rect x="32" y="985" width="1376" height="158" rx="20" fill="#edf2f8" stroke="#e1e8f1" stroke-width="1.5"/><text x="54" y="1016" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#132640" font-weight="700">CARDINALITY AND QUERY RULES</text><text x="54" y="1038" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#60748b" font-weight="400">PK/FK relationships are tested in dbt; constraints are not enforced as DuckDB DDL.</text><text x="62" y="1067" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#203650" font-weight="400">One complaint can have no published narrative and zero, one or two observed tags.</text><text x="62" y="1102" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#60748b" font-weight="400">Use EXISTS or deduplicate complaint IDs when filtering tags; joining the bridge directly can multiply complaint rows.</text><text x="42" y="1215" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#60748b" font-weight="700">FINANCIAL COMPLAINT INTELLIGENCE  /  DESIGN BASELINE · 04 OCT 2026</text></svg>