<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="1160" viewBox="0 0 1700 1160" role="img"><title>LLD 02  /  Gold-to-dashboard contracts</title><desc>Data-product interface view · Aggregate grain, lineage, metric algebra and cache identity</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0 8 4 0 8z" fill="#63758A"/></marker></defs><rect width="1700" height="1160" fill="#F4F7FB"/><rect x="0" y="0" width="1700" height="160" rx="0" fill="#122B45" stroke="#122B45" stroke-width="1.5"/><text x="54" y="44" font-family="Arial, sans-serif" font-size="14" fill="#72D5D0" font-weight="700">FINANCIAL COMPLAINT INTELLIGENCE  /  ENGINEERING DESIGN</text><text x="54" y="100" font-family="Arial, sans-serif" font-size="32" fill="#FFFFFF" font-weight="700">LLD 02  /  Gold-to-dashboard contracts</text><text x="54" y="129" font-family="Arial, sans-serif" font-size="16" fill="#D9E5F0" font-weight="400">Data-product interface view · Aggregate grain, lineage, metric algebra and cache identity</text><text x="1290" y="42" font-family="Arial, sans-serif" font-size="12" fill="#D9E5F0" font-weight="400">DESIGN BASELINE  ·  05 OCT 2026</text><text x="54" y="195" font-family="Arial, sans-serif" font-size="14" fill="#63758A" font-weight="400">SCOPE: main_gold.complaint_metrics → four Parquet contracts → independent dashboard queries</text><rect x="45" y="230" width="385" height="665" rx="16" fill="#EAF0F6" stroke="#BBCAD8" stroke-width="1.5"/><text x="63" y="259" font-family="Arial, sans-serif" font-size="15" fill="#B47A13" font-weight="700">PRODUCER</text><text x="63" y="281" font-family="Arial, sans-serif" font-size="12" fill="#63758A" font-weight="400">Complaint-grain numerical source</text><rect x="470" y="230" width="740" height="665" rx="16" fill="#EAF0F6" stroke="#BBCAD8" stroke-width="1.5"/><text x="488" y="259" font-family="Arial, sans-serif" font-size="15" fill="#087F8C" font-weight="700">VERSIONED SERVING INTERFACES</text><text x="488" y="281" font-family="Arial, sans-serif" font-size="12" fill="#63758A" font-weight="400">All datasets preserve NULL groups and reconcile all 18 sums</text><rect x="1250" y="230" width="405" height="665" rx="16" fill="#EAF0F6" stroke="#BBCAD8" stroke-width="1.5"/><text x="1268" y="259" font-family="Arial, sans-serif" font-size="15" fill="#3466AC" font-weight="700">CONSUMER</text><text x="1268" y="281" font-family="Arial, sans-serif" font-size="12" fill="#63758A" font-weight="400">dashboard/app.py</text><rect x="70" y="325" width="335" height="195" rx="12" fill="#FFFFFF" stroke="#C1CFDD" stroke-width="1.5"/><rect x="70" y="339" width="5" height="167" rx="2" fill="#B47A13"/><rect x="86" y="343" width="54" height="54" rx="10" fill="#EEF3F8" stroke="#EEF3F8" stroke-width="1.5"/><g transform="translate(91,348)"><svg xmlns="http://www.w3.org/2000/svg" width="44" height="44" viewBox="0 0 44 44"><g fill="#B47A13" color="#B47A13"><ellipse cx="22" cy="10" rx="16" ry="6"/><path d="M6 10v23c0 8 32 8 32 0V10c-8 7-24 7-32 0z"/><path d="M7 21c8 6 22 6 30 0" fill="none" stroke="white" stroke-width="2"/></g></svg></g><text x="152" y="360" font-family="Arial, sans-serif" font-size="17" fill="#122B45" font-weight="700">complaint_metrics</text><text x="152" y="380" font-family="Arial, sans-serif" font-size="11" fill="#B47A13" font-weight="700">TABLE / ONE COMPLAINT PER ROW</text><text x="90" y="425" font-family="Arial, sans-serif" font-size="13" fill="#40566C" font-weight="400">Complaint ID: unique, non-NULL</text><text x="90" y="448" font-family="Arial, sans-serif" font-size="13" fill="#40566C" font-weight="400">Date + company + product context</text><text x="90" y="471" font-family="Arial, sans-serif" font-size="13" fill="#40566C" font-weight="400">18 additive count flags</text><text x="90" y="494" font-family="Arial, sans-serif" font-size="13" fill="#40566C" font-weight="400">No resolution duration / loss amounts</text><rect x="495" y="325" width="335" height="160" rx="12" fill="#FFFFFF" stroke="#C1CFDD" stroke-width="1.5"/><rect x="495" y="339" width="5" height="132" rx="2" fill="#087F8C"/><rect x="511" y="343" width="54" height="54" rx="10" fill="#EEF3F8" stroke="#EEF3F8" stroke-width="1.5"/><g transform="translate(516,348)"><svg xmlns="http://www.w3.org/2000/svg" width="44" height="44" viewBox="0 0 44 44"><g fill="#087F8C" color="#087F8C"><path d="M5 8h25v31H5z"/><path d="M13 3h22l6 7v24h-8V15H13z"/><path d="M11 19h12m-12 7h12m-12 6h9" fill="none" stroke="white" stroke-width="2"/></g></svg></g><text x="577" y="360" font-family="Arial, sans-serif" font-size="17" fill="#122B45" font-weight="700">Company / product</text><text x="577" y="380" font-family="Arial, sans-serif" font-size="11" fill="#087F8C" font-weight="700">PARQUET / BASE DAILY GRAIN</text><text x="515" y="425" font-family="Arial, sans-serif" font-size="13" fill="#40566C" font-weight="400">date_received + company ID/name</text><text x="515" y="448" font-family="Arial, sans-serif" font-size="13" fill="#40566C" font-weight="400">product ID / product / sub-product</text><text x="515" y="471" font-family="Arial, sans-serif" font-size="13" fill="#40566C" font-weight="400">Overview, Trends, Companies, Outcomes</text><rect x="850" y="325" width="335" height="160" rx="12" fill="#FFFFFF" stroke="#C1CFDD" stroke-width="1.5"/><rect x="850" y="339" width="5" height="132" rx="2" fill="#087F8C"/><rect x="866" y="343" width="54" height="54" rx="10" fill="#EEF3F8" stroke="#EEF3F8" stroke-width="1.5"/><g transform="translate(871,348)"><svg xmlns="http://www.w3.org/2000/svg" width="44" height="44" viewBox="0 0 44 44"><g fill="#087F8C" color="#087F8C"><path d="M5 8h25v31H5z"/><path d="M13 3h22l6 7v24h-8V15H13z"/><path d="M11 19h12m-12 7h12m-12 6h9" fill="none" stroke="white" stroke-width="2"/></g></svg></g><text x="932" y="360" font-family="Arial, sans-serif" font-size="17" fill="#122B45" font-weight="700">Issues</text><text x="932" y="380" font-family="Arial, sans-serif" font-size="11" fill="#087F8C" font-weight="700">PARQUET / BASE + ISSUE DETAIL</text><text x="870" y="425" font-family="Arial, sans-serif" font-size="13" fill="#40566C" font-weight="400">Extra grain: issue + sub_issue</text><text x="870" y="448" font-family="Arial, sans-serif" font-size="13" fill="#40566C" font-weight="400">Product and issue drilldown</text><text x="870" y="471" font-family="Arial, sans-serif" font-size="13" fill="#40566C" font-weight="400">Issue selection is local to its charts</text><rect x="495" y="555" width="335" height="160" rx="12" fill="#FFFFFF" stroke="#C1CFDD" stroke-width="1.5"/><rect x="495" y="569" width="5" height="132" rx="2" fill="#3466AC"/><rect x="511" y="573" width="54" height="54" rx="10" fill="#EEF3F8" stroke="#EEF3F8" stroke-width="1.5"/><g transform="translate(516,578)"><svg xmlns="http://www.w3.org/2000/svg" width="44" height="44" viewBox="0 0 44 44"><g fill="#3466AC" color="#3466AC"><path d="M5 8h25v31H5z"/><path d="M13 3h22l6 7v24h-8V15H13z"/><path d="M11 19h12m-12 7h12m-12 6h9" fill="none" stroke="white" stroke-width="2"/></g></svg></g><text x="577" y="590" font-family="Arial, sans-serif" font-size="17" fill="#122B45" font-weight="700">Geography</text><text x="577" y="610" font-family="Arial, sans-serif" font-size="11" fill="#3466AC" font-weight="700">PARQUET / BASE + STATE</text><text x="515" y="655" font-family="Arial, sans-serif" font-size="13" fill="#40566C" font-weight="400">Extra grain: reported state</text><text x="515" y="678" font-family="Arial, sans-serif" font-size="13" fill="#40566C" font-weight="400">Map + unmappable-state table</text><text x="515" y="701" font-family="Arial, sans-serif" font-size="13" fill="#40566C" font-weight="400">Not geocoded customer locations</text><rect x="850" y="555" width="335" height="160" rx="12" fill="#FFFFFF" stroke="#C1CFDD" stroke-width="1.5"/><rect x="850" y="569" width="5" height="132" rx="2" fill="#3466AC"/><rect x="866" y="573" width="54" height="54" rx="10" fill="#EEF3F8" stroke="#EEF3F8" stroke-width="1.5"/><g transform="translate(871,578)"><svg xmlns="http://www.w3.org/2000/svg" width="44" height="44" viewBox="0 0 44 44"><g fill="#3466AC" color="#3466AC"><path d="M5 8h25v31H5z"/><path d="M13 3h22l6 7v24h-8V15H13z"/><path d="M11 19h12m-12 7h12m-12 6h9" fill="none" stroke="white" stroke-width="2"/></g></svg></g><text x="932" y="590" font-family="Arial, sans-serif" font-size="17" fill="#122B45" font-weight="700">Channels</text><text x="932" y="610" font-family="Arial, sans-serif" font-size="11" fill="#3466AC" font-weight="700">PARQUET / BASE + CHANNEL</text><text x="870" y="655" font-family="Arial, sans-serif" font-size="13" fill="#40566C" font-weight="400">Extra grain: submission_channel</text><text x="870" y="678" font-family="Arial, sans-serif" font-size="13" fill="#40566C" font-weight="400">Channel comparison</text><text x="870" y="701" font-family="Arial, sans-serif" font-size="13" fill="#40566C" font-weight="400">Same global filters and metrics</text><rect x="1280" y="325" width="345" height="195" rx="12" fill="#FFFFFF" stroke="#C1CFDD" stroke-width="1.5"/><rect x="1280" y="339" width="5" height="167" rx="2" fill="#3466AC"/><rect x="1296" y="343" width="54" height="54" rx="10" fill="#EEF3F8" stroke="#EEF3F8" stroke-width="1.5"/><g transform="translate(1301,348)"><svg xmlns="http://www.w3.org/2000/svg" width="44" height="44" viewBox="0 0 44 44"><g fill="#3466AC" color="#3466AC"><rect x="2" y="5" width="40" height="34" rx="4"/><path d="m15 15-8 7 8 7m14-14 8 7-8 7m-5-17-4 22" fill="none" stroke="white" stroke-width="2.5"/></g></svg></g><text x="1362" y="360" font-family="Arial, sans-serif" font-size="17" fill="#122B45" font-weight="700">Independent queries</text><text x="1362" y="380" font-family="Arial, sans-serif" font-size="11" fill="#3466AC" font-weight="700">DUCKDB / PARAMETERIZED SQL</text><text x="1300" y="425" font-family="Arial, sans-serif" font-size="13" fill="#40566C" font-weight="400">Date / company / product filters</text><text x="1300" y="448" font-family="Arial, sans-serif" font-size="13" fill="#40566C" font-weight="400">Never join the four serving grains</text><text x="1300" y="471" font-family="Arial, sans-serif" font-size="13" fill="#40566C" font-weight="400">SUM numerator / SUM denominator</text><text x="1300" y="494" font-family="Arial, sans-serif" font-size="13" fill="#40566C" font-weight="400">No average of subgroup rates</text><rect x="1280" y="555" width="345" height="160" rx="12" fill="#FFFFFF" stroke="#C1CFDD" stroke-width="1.5"/><rect x="1280" y="569" width="5" height="132" rx="2" fill="#087F8C"/><rect x="1296" y="573" width="54" height="54" rx="10" fill="#EEF3F8" stroke="#EEF3F8" stroke-width="1.5"/><g transform="translate(1301,578)"><svg xmlns="http://www.w3.org/2000/svg" width="44" height="44" viewBox="0 0 44 44"><g fill="#087F8C" color="#087F8C"><rect x="3" y="5" width="38" height="32" rx="4"/><path d="M7 12h30M14 33V23m8 10V17m8 16V21" fill="none" stroke="white" stroke-width="3"/></g></svg></g><text x="1362" y="590" font-family="Arial, sans-serif" font-size="17" fill="#122B45" font-weight="700">Presentation contract</text><text x="1362" y="610" font-family="Arial, sans-serif" font-size="11" fill="#087F8C" font-weight="700">STREAMLIT / SEVEN TABS</text><text x="1300" y="655" font-family="Arial, sans-serif" font-size="13" fill="#40566C" font-weight="400">K / M / B on labels and hover</text><text x="1300" y="678" font-family="Arial, sans-serif" font-size="13" fill="#40566C" font-weight="400">Percentages use explicit denominators</text><text x="1300" y="701" font-family="Arial, sans-serif" font-size="13" fill="#40566C" font-weight="400">CSV preserves exact count values</text><rect x="70" y="595" width="335" height="245" rx="12" fill="#FFFFFF" stroke="#C1CFDD" stroke-width="1.5"/><rect x="70" y="609" width="5" height="217" rx="2" fill="#7555A1"/><rect x="86" y="613" width="54" height="54" rx="10" fill="#EEF3F8" stroke="#EEF3F8" stroke-width="1.5"/><g transform="translate(91,618)"><svg xmlns="http://www.w3.org/2000/svg" width="44" height="44" viewBox="0 0 44 44"><g fill="#7555A1" color="#7555A1"><path d="M8 3h21l9 10v28H8z"/><path d="M28 3v12h10M14 22h18m-18 7h18m-18 7h12" fill="none" stroke="white" stroke-width="2"/></g></svg></g><text x="152" y="630" font-family="Arial, sans-serif" font-size="17" fill="#122B45" font-weight="700">refresh_manifest.json</text><text x="152" y="650" font-family="Arial, sans-serif" font-size="11" fill="#7555A1" font-weight="700">METADATA / SUCCESSFUL REVISION</text><text x="90" y="695" font-family="Arial, sans-serif" font-size="13" fill="#40566C" font-weight="400">Revision SHA-256; source URLs / hashes</text><text x="90" y="718" font-family="Arial, sans-serif" font-size="13" fill="#40566C" font-weight="400">HTTP validators; retention boundaries</text><text x="90" y="741" font-family="Arial, sans-serif" font-size="13" fill="#40566C" font-weight="400">Observed min / max received dates</text><text x="90" y="764" font-family="Arial, sans-serif" font-size="13" fill="#40566C" font-weight="400">Flag totals; export hashes / sizes</text><text x="90" y="787" font-family="Arial, sans-serif" font-size="13" fill="#40566C" font-weight="400">Overlap count; validation timestamp</text><text x="90" y="810" font-family="Arial, sans-serif" font-size="13" fill="#40566C" font-weight="400">Historical fallback if manifest absent</text><path d="M405 385 L495 385" fill="none" stroke="#63758A" stroke-width="2" marker-end="url(#arrow)"/><text x="407" y="374" font-family="Arial, sans-serif" font-size="11" fill="#63758A" font-weight="400">GROUP BY / SUM</text><path d="M405 445 L447 445 L447 302 L1018 302 L1018 325" fill="none" stroke="#63758A" stroke-width="2" marker-end="url(#arrow)"/><text x="590" y="293" font-family="Arial, sans-serif" font-size="11" fill="#63758A" font-weight="400">Independent aggregation from wide gold</text><path d="M405 475 L447 475 L447 635 L495 635" fill="none" stroke="#63758A" stroke-width="2" marker-end="url(#arrow)"/><text x="451" y="614" font-family="Arial, sans-serif" font-size="11" fill="#63758A" font-weight="400">SUM</text><path d="M405 500 L442 500 L442 745 L1018 745 L1018 715" fill="none" stroke="#63758A" stroke-width="2" marker-end="url(#arrow)"/><text x="600" y="763" font-family="Arial, sans-serif" font-size="11" fill="#63758A" font-weight="400">Independent aggregation from wide gold</text><path d="M830 455 L840 455 L840 530 L1230 530 L1230 460 L1280 460" fill="none" stroke="#63758A" stroke-width="2" marker-end="url(#arrow)"/><text x="1000" y="518" font-family="Arial, sans-serif" font-size="11" fill="#63758A" font-weight="400">Independent file reads</text><path d="M1185 405 L1280 405" fill="none" stroke="#63758A" stroke-width="2" marker-end="url(#arrow)"/><text x="1210" y="393" font-family="Arial, sans-serif" font-size="11" fill="#63758A" font-weight="400">Read</text><path d="M830 620 L840 620 L840 530 L1230 530 L1230 460 L1280 460" fill="none" stroke="#63758A" stroke-width="2" marker-end="url(#arrow)"/><text x="1235" y="486" font-family="Arial, sans-serif" font-size="11" fill="#63758A" font-weight="400"></text><path d="M1185 620 L1230 620 L1230 460 L1280 460" fill="none" stroke="#63758A" stroke-width="2" marker-end="url(#arrow)"/><text x="1235" y="506" font-family="Arial, sans-serif" font-size="11" fill="#63758A" font-weight="400"></text><path d="M1452 520 L1452 555" fill="none" stroke="#63758A" stroke-width="2" marker-end="url(#arrow)"/><text x="1463" y="542" font-family="Arial, sans-serif" font-size="11" fill="#63758A" font-weight="400">Results</text><rect x="495" y="790" width="690" height="85" rx="14" fill="#FFFFFF" stroke="#C1CFDD" stroke-width="1.5"/><text x="513" y="818" font-family="Arial, sans-serif" font-size="14" fill="#7555A1" font-weight="700">CACHE / FILE IDENTITY</text><text x="513" y="844" font-family="Arial, sans-serif" font-size="12" fill="#63758A" font-weight="400">Each cached query receives (mtime_ns, file_size) as explicit arguments.</text><text x="513" y="865" font-family="Arial, sans-serif" font-size="12" fill="#63758A" font-weight="400">Checkout updates change cache identity; retained previous-period coverage is checked.</text><rect x="45" y="945" width="1610" height="120" rx="14" fill="#FFFFFF" stroke="#C1CFDD" stroke-width="1.5"/><text x="63" y="973" font-family="Arial, sans-serif" font-size="14" fill="#B47A13" font-weight="700">RELEASE CONTRACT</text><text x="63" y="999" font-family="Arial, sans-serif" font-size="12" fill="#63758A" font-weight="400">Files: dashboard_daily_company_product.parquet · dashboard_issues.parquet · dashboard_geography.parquet · dashboard_channels.parquet</text><text x="63" y="1020" font-family="Arial, sans-serif" font-size="12" fill="#63758A" font-weight="400">One staged revision → one release commit with reports/refresh_manifest.json. No partially validated release is promoted.</text><text x="63" y="1041" font-family="Arial, sans-serif" font-size="12" fill="#63758A" font-weight="400">This is an analytics interface, not a complaint-text retrieval API. Future AI requires a persistent detailed-data service.</text><text x="54" y="1107" font-family="Arial, sans-serif" font-size="12" fill="#63758A" font-weight="400">LEGEND  ·  Filled icons = component type  |  Solid cards = implemented  |  Dashed cards = planned</text><text x="54" y="1130" font-family="Arial, sans-serif" font-size="12" fill="#63758A" font-weight="400">Solid arrows = data / publication flow  |  Dashed arrows = control / development flow  |  Arrows from gold represent independent aggregations; no inter-export joins</text></svg>