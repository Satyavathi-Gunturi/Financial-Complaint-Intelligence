<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="1180" viewBox="0 0 1700 1180" role="img"><title>LLD 03  /  Release lifecycle &amp; failure handling</title><desc>State and control-flow view · Source revision to merge-gated publication</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0 8 4 0 8z" fill="#63758A"/></marker></defs><rect width="1700" height="1180" fill="#F4F7FB"/><rect x="0" y="0" width="1700" height="160" rx="0" fill="#122B45" stroke="#122B45" stroke-width="1.5"/><text x="54" y="44" font-family="Arial, sans-serif" font-size="14" fill="#72D5D0" font-weight="700">FINANCIAL COMPLAINT INTELLIGENCE  /  ENGINEERING DESIGN</text><text x="54" y="100" font-family="Arial, sans-serif" font-size="32" fill="#FFFFFF" font-weight="700">LLD 03  /  Release lifecycle &amp; failure handling</text><text x="54" y="129" font-family="Arial, sans-serif" font-size="16" fill="#D9E5F0" font-weight="400">State and control-flow view · Source revision to merge-gated publication</text><text x="1290" y="42" font-family="Arial, sans-serif" font-size="12" fill="#D9E5F0" font-weight="400">DESIGN BASELINE  ·  05 OCT 2026</text><text x="54" y="195" font-family="Arial, sans-serif" font-size="14" fill="#63758A" font-weight="400">SCOPE: .github/workflows/data-refresh.yml and scripts/refresh_pipeline.py</text><rect x="45" y="230" width="1610" height="600" rx="16" fill="#EAF0F6" stroke="#BBCAD8" stroke-width="1.5"/><text x="63" y="259" font-family="Arial, sans-serif" font-size="15" fill="#087F8C" font-weight="700">PROCESSING AND PUBLICATION STATES</text><text x="63" y="281" font-family="Arial, sans-serif" font-size="12" fill="#63758A" font-weight="400">A release becomes current only through a successful PR merge</text><rect x="75" y="315" width="320" height="150" rx="12" fill="#FFFFFF" stroke="#C1CFDD" stroke-width="1.5"/><rect x="75" y="329" width="5" height="122" rx="2" fill="#3466AC"/><rect x="91" y="333" width="54" height="54" rx="10" fill="#EEF3F8" stroke="#EEF3F8" stroke-width="1.5"/><g transform="translate(96,338)"><svg xmlns="http://www.w3.org/2000/svg" width="44" height="44" viewBox="0 0 44 44"><g fill="#3466AC" color="#3466AC"><circle cx="18" cy="18" r="13"/><path d="m27 27 13 13" fill="none" stroke="currentColor" stroke-width="7"/><circle cx="18" cy="18" r="8" fill="white"/></g></svg></g><text x="157" y="350" font-family="Arial, sans-serif" font-size="17" fill="#122B45" font-weight="700">Discover &amp; compare</text><text x="157" y="370" font-family="Arial, sans-serif" font-size="11" fill="#3466AC" font-weight="700">STATE / OFFICIAL SOURCES</text><text x="95" y="415" font-family="Arial, sans-serif" font-size="13" fill="#40566C" font-weight="400">Validate URLs, hashes and window</text><text x="95" y="438" font-family="Arial, sans-serif" font-size="13" fill="#40566C" font-weight="400">Compute deterministic revision</text><rect x="470" y="315" width="320" height="150" rx="12" fill="#FFFFFF" stroke="#C1CFDD" stroke-width="1.5"/><rect x="470" y="329" width="5" height="122" rx="2" fill="#087F8C"/><rect x="486" y="333" width="54" height="54" rx="10" fill="#EEF3F8" stroke="#EEF3F8" stroke-width="1.5"/><g transform="translate(491,338)"><svg xmlns="http://www.w3.org/2000/svg" width="44" height="44" viewBox="0 0 44 44"><g fill="#087F8C" color="#087F8C"><path d="M11 7h22l10 15-10 15H11L1 22z"/><path d="M14 22h15m-5-6 6 6-6 6" fill="none" stroke="white" stroke-width="3"/></g></svg></g><text x="552" y="350" font-family="Arial, sans-serif" font-size="17" fill="#122B45" font-weight="700">Build retained window</text><text x="552" y="370" font-family="Arial, sans-serif" font-size="11" fill="#087F8C" font-weight="700">STATE / FRESH DATABASE</text><text x="490" y="415" font-family="Arial, sans-serif" font-size="13" fill="#40566C" font-weight="400">Parse / retain / deduplicate</text><text x="490" y="438" font-family="Arial, sans-serif" font-size="13" fill="#40566C" font-weight="400">dbt build + data tests</text><rect x="865" y="315" width="320" height="150" rx="12" fill="#FFFFFF" stroke="#C1CFDD" stroke-width="1.5"/><rect x="865" y="329" width="5" height="122" rx="2" fill="#087F8C"/><rect x="881" y="333" width="54" height="54" rx="10" fill="#EEF3F8" stroke="#EEF3F8" stroke-width="1.5"/><g transform="translate(886,338)"><svg xmlns="http://www.w3.org/2000/svg" width="44" height="44" viewBox="0 0 44 44"><g fill="#087F8C" color="#087F8C"><path d="M22 3 39 9v12c0 11-8 17-17 21C13 38 5 32 5 21V9z"/><path d="m12 22 7 7 13-15" fill="none" stroke="white" stroke-width="3"/></g></svg></g><text x="947" y="350" font-family="Arial, sans-serif" font-size="17" fill="#122B45" font-weight="700">Validate &amp; stage</text><text x="947" y="370" font-family="Arial, sans-serif" font-size="11" fill="#087F8C" font-weight="700">STATE / EXPORT GATE</text><text x="885" y="415" font-family="Arial, sans-serif" font-size="13" fill="#40566C" font-weight="400">18 sums match all four exports</text><text x="885" y="438" font-family="Arial, sans-serif" font-size="13" fill="#40566C" font-weight="400">Manifest + per-file size guard</text><rect x="1260" y="315" width="320" height="150" rx="12" fill="#FFFFFF" stroke="#C1CFDD" stroke-width="1.5"/><rect x="1260" y="329" width="5" height="122" rx="2" fill="#3466AC"/><rect x="1276" y="333" width="54" height="54" rx="10" fill="#EEF3F8" stroke="#EEF3F8" stroke-width="1.5"/><g transform="translate(1281,338)"><svg xmlns="http://www.w3.org/2000/svg" width="44" height="44" viewBox="0 0 44 44"><g fill="#3466AC" color="#3466AC"><path d="M11 10v24m0-12h15c6 0 7-5 7-10" fill="none" stroke="currentColor" stroke-width="6"/><circle cx="11" cy="7" r="6"/><circle cx="11" cy="36" r="6"/><circle cx="33" cy="7" r="6"/></g></svg></g><text x="1342" y="350" font-family="Arial, sans-serif" font-size="17" fill="#122B45" font-weight="700">Open release PR</text><text x="1342" y="370" font-family="Arial, sans-serif" font-size="11" fill="#3466AC" font-weight="700">STATE / GITHUB BRANCH</text><text x="1280" y="415" font-family="Arial, sans-serif" font-size="13" fill="#40566C" font-weight="400">Commit five files + manifest</text><text x="1280" y="438" font-family="Arial, sans-serif" font-size="13" fill="#40566C" font-weight="400">No direct push to main</text><rect x="75" y="630" width="320" height="150" rx="12" fill="#FFFFFF" stroke="#C1CFDD" stroke-width="1.5"/><rect x="75" y="644" width="5" height="122" rx="2" fill="#63758A"/><rect x="91" y="648" width="54" height="54" rx="10" fill="#EEF3F8" stroke="#EEF3F8" stroke-width="1.5"/><g transform="translate(96,653)"><svg xmlns="http://www.w3.org/2000/svg" width="44" height="44" viewBox="0 0 44 44"><g fill="#63758A" color="#63758A"><circle cx="22" cy="22" r="17"/><path d="M22 10v13l9 5" fill="none" stroke="white" stroke-width="3"/></g></svg></g><text x="157" y="665" font-family="Arial, sans-serif" font-size="17" fill="#122B45" font-weight="700">No changed revision</text><text x="157" y="685" font-family="Arial, sans-serif" font-size="11" fill="#63758A" font-weight="700">TERMINAL / SKIP</text><text x="95" y="730" font-family="Arial, sans-serif" font-size="13" fill="#40566C" font-weight="400">No rebuild or publication</text><text x="95" y="753" font-family="Arial, sans-serif" font-size="13" fill="#40566C" font-weight="400">Current serving files retained</text><rect x="470" y="630" width="320" height="150" rx="12" fill="#FFFFFF" stroke="#C1CFDD" stroke-width="1.5"/><rect x="470" y="644" width="5" height="122" rx="2" fill="#B84C48"/><rect x="486" y="648" width="54" height="54" rx="10" fill="#EEF3F8" stroke="#EEF3F8" stroke-width="1.5"/><g transform="translate(491,653)"><svg xmlns="http://www.w3.org/2000/svg" width="44" height="44" viewBox="0 0 44 44"><g fill="#B84C48" color="#B84C48"><path d="M13 3h18l12 12v17L31 43H13L1 31V15z"/><path d="m14 14 16 16m0-16L14 30" fill="none" stroke="white" stroke-width="3"/></g></svg></g><text x="552" y="665" font-family="Arial, sans-serif" font-size="17" fill="#122B45" font-weight="700">Processing failed</text><text x="552" y="685" font-family="Arial, sans-serif" font-size="11" fill="#B84C48" font-weight="700">TERMINAL / ABORT</text><text x="490" y="730" font-family="Arial, sans-serif" font-size="13" fill="#40566C" font-weight="400">Download, parse, dbt or export error</text><text x="490" y="753" font-family="Arial, sans-serif" font-size="13" fill="#40566C" font-weight="400">Preserve last published release</text><rect x="865" y="630" width="320" height="150" rx="12" fill="#FFFFFF" stroke="#C1CFDD" stroke-width="1.5"/><rect x="865" y="644" width="5" height="122" rx="2" fill="#B47A13"/><rect x="881" y="648" width="54" height="54" rx="10" fill="#EEF3F8" stroke="#EEF3F8" stroke-width="1.5"/><g transform="translate(886,653)"><svg xmlns="http://www.w3.org/2000/svg" width="44" height="44" viewBox="0 0 44 44"><g fill="#B47A13" color="#B47A13"><path d="M22 3 39 9v12c0 11-8 17-17 21C13 38 5 32 5 21V9z"/><path d="m12 22 7 7 13-15" fill="none" stroke="white" stroke-width="3"/></g></svg></g><text x="947" y="665" font-family="Arial, sans-serif" font-size="17" fill="#122B45" font-weight="700">Merge blocked</text><text x="947" y="685" font-family="Arial, sans-serif" font-size="11" fill="#B47A13" font-weight="700">STATE / PENDING PR</text><text x="885" y="730" font-family="Arial, sans-serif" font-size="13" fill="#40566C" font-weight="400">Required rules remain authoritative</text><text x="885" y="753" font-family="Arial, sans-serif" font-size="13" fill="#40566C" font-weight="400">Current serving data stays in place</text><rect x="1260" y="630" width="320" height="150" rx="12" fill="#FFFFFF" stroke="#C1CFDD" stroke-width="1.5"/><rect x="1260" y="644" width="5" height="122" rx="2" fill="#087F8C"/><rect x="1276" y="648" width="54" height="54" rx="10" fill="#EEF3F8" stroke="#EEF3F8" stroke-width="1.5"/><g transform="translate(1281,653)"><svg xmlns="http://www.w3.org/2000/svg" width="44" height="44" viewBox="0 0 44 44"><g fill="#087F8C" color="#087F8C"><rect x="3" y="5" width="38" height="32" rx="4"/><path d="M7 12h30M14 33V23m8 10V17m8 16V21" fill="none" stroke="white" stroke-width="3"/></g></svg></g><text x="1342" y="665" font-family="Arial, sans-serif" font-size="17" fill="#122B45" font-weight="700">Merged release</text><text x="1342" y="685" font-family="Arial, sans-serif" font-size="11" fill="#087F8C" font-weight="700">TERMINAL / MAIN + DEPLOY</text><text x="1280" y="730" font-family="Arial, sans-serif" font-size="13" fill="#40566C" font-weight="400">Merge commit records history</text><text x="1280" y="753" font-family="Arial, sans-serif" font-size="13" fill="#40566C" font-weight="400">Streamlit picks up merged files</text><path d="M395 390 L470 390" fill="none" stroke="#63758A" stroke-width="2" marker-end="url(#arrow)"/><text x="402" y="377" font-family="Arial, sans-serif" font-size="11" fill="#63758A" font-weight="400">Changed</text><path d="M790 390 L865 390" fill="none" stroke="#63758A" stroke-width="2" marker-end="url(#arrow)"/><text x="795" y="377" font-family="Arial, sans-serif" font-size="11" fill="#63758A" font-weight="400">Tests pass</text><path d="M1185 390 L1260 390" fill="none" stroke="#63758A" stroke-width="2" marker-end="url(#arrow)"/><text x="1188" y="376" font-family="Arial, sans-serif" font-size="11" fill="#63758A" font-weight="400">All gates pass</text><path d="M235 465 L235 630" fill="none" stroke="#63758A" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="6 5"/><text x="248" y="546" font-family="Arial, sans-serif" font-size="11" fill="#63758A" font-weight="400">Unchanged</text><path d="M630 465 L630 630" fill="none" stroke="#B84C48" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="6 5"/><text x="643" y="546" font-family="Arial, sans-serif" font-size="11" fill="#B84C48" font-weight="400">Failure</text><path d="M1420 465 L1420 550 L1025 550 L1025 630" fill="none" stroke="#B47A13" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="6 5"/><text x="1065" y="536" font-family="Arial, sans-serif" font-size="11" fill="#B47A13" font-weight="400">Permission / policy prevents merge</text><path d="M1525 465 L1525 630" fill="none" stroke="#63758A" stroke-width="2" marker-end="url(#arrow)"/><text x="1380" y="596" font-family="Arial, sans-serif" font-size="11" fill="#63758A" font-weight="400">Merge succeeds</text><path d="M1185 705 L1260 705" fill="none" stroke="#63758A" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="6 5"/><text x="1190" y="689" font-family="Arial, sans-serif" font-size="11" fill="#63758A" font-weight="400">Rules met</text><rect x="45" y="875" width="785" height="175" rx="14" fill="#FFFFFF" stroke="#C1CFDD" stroke-width="1.5"/><text x="63" y="903" font-family="Arial, sans-serif" font-size="14" fill="#B84C48" font-weight="700">FAILURE / EVIDENCE CONTRACT</text><text x="63" y="929" font-family="Arial, sans-serif" font-size="12" fill="#63758A" font-weight="400">Discovery, download and validation failures can abort from any processing state.</text><text x="63" y="950" font-family="Arial, sans-serif" font-size="12" fill="#63758A" font-weight="400">Build logs, run_results and manifest are uploaded with if: always().</text><text x="63" y="971" font-family="Arial, sans-serif" font-size="12" fill="#63758A" font-weight="400">Evidence artifacts last 14 days; ZIP cache is not durable source-version storage.</text><text x="63" y="992" font-family="Arial, sans-serif" font-size="12" fill="#63758A" font-weight="400">Current observed failure: HTTP 403 at the first hosted archive download.</text><rect x="870" y="875" width="785" height="175" rx="14" fill="#FFFFFF" stroke="#C1CFDD" stroke-width="1.5"/><text x="888" y="903" font-family="Arial, sans-serif" font-size="14" fill="#7555A1" font-weight="700">CONCURRENCY / REPOSITORY RULES</text><text x="888" y="929" font-family="Arial, sans-serif" font-size="12" fill="#63758A" font-weight="400">New main refresh runs cancel older runs in the same concurrency group.</text><text x="888" y="950" font-family="Arial, sans-serif" font-size="12" fill="#63758A" font-weight="400">GITHUB_TOKEN-created PRs do not trigger independent PR Actions CI.</text><text x="888" y="971" font-family="Arial, sans-serif" font-size="12" fill="#63758A" font-weight="400">Full validation runs before PR creation; no protected-branch bypass.</text><text x="888" y="992" font-family="Arial, sans-serif" font-size="12" fill="#63758A" font-weight="400">Source-download resolution and first full rolling publication remain open.</text><text x="54" y="1127" font-family="Arial, sans-serif" font-size="12" fill="#63758A" font-weight="400">LEGEND  ·  Filled icons = component type  |  Solid cards = implemented  |  Dashed cards = planned</text><text x="54" y="1150" font-family="Arial, sans-serif" font-size="12" fill="#63758A" font-weight="400">Solid arrows = data / publication flow  |  Dashed arrows = control / development flow  |  Source failures never imply a successful data refresh</text></svg>