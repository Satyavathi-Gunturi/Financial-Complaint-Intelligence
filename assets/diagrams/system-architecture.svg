e grains + 60K excerpts</text><text x="855" y="778" font-family="Arial, sans-serif" font-size="13" fill="#40566C" font-weight="400">One revision + validation manifest</text><rect x="1280" y="655" width="345" height="145" rx="12" fill="#FFFFFF" stroke="#C1CFDD" stroke-width="1.5"/><rect x="1280" y="669" width="5" height="117" rx="2" fill="#3466AC"/><rect x="1296" y="673" width="54" height="54" rx="10" fill="#EEF3F8" stroke="#EEF3F8" stroke-width="1.5"/><g transform="translate(1301,678)"><svg xmlns="http://www.w3.org/2000/svg" width="44" height="44" viewBox="0 0 44 44"><g fill="#3466AC" color="#3466AC"><path d="M11 10v24m0-12h15c6 0 7-5 7-10" fill="none" stroke="currentColor" stroke-width="6"/><circle cx="11" cy="7" r="6"/><circle cx="11" cy="36" r="6"/><circle cx="33" cy="7" r="6"/></g></svg></g><text x="1362" y="690" font-family="Arial, sans-serif" font-size="17" fill="#122B45" font-weight="700">Release repository</text><text x="1362" y="710" font-family="Arial, sans-serif" font-size="11" fill="#3466AC" font-weight="700">SYSTEM / GITHUB BRANCH + PR</text><text x="1300" y="755" font-family="Arial, sans-serif" font-size="13" fill="#40566C" font-weight="400">Merge commit respects branch rules</text><text x="1300" y="778" font-family="Arial, sans-serif" font-size="13" fill="#40566C" font-weight="400">All serving files published together</text><rect x="1280" y="850" width="345" height="130" rx="12" fill="#FFFFFF" stroke="#C1CFDD" stroke-width="1.5"/><rect x="1280" y="864" width="5" height="102" rx="2" fill="#087F8C"/><rect x="1296" y="868" width="54" height="54" rx="10" fill="#EEF3F8" stroke="#EEF3F8" stroke-width="1.5"/><g transform="translate(1301,873)"><svg xmlns="http://www.w3.org/2000/svg" width="44" height="44" viewBox="0 0 44 44"><g fill="#087F8C" color="#087F8C"><rect x="3" y="5" width="38" height="32" rx="4"/><path d="M7 12h30M14 33V23m8 10V17m8 16V21" fill="none" stroke="white" stroke-width="3"/></g></svg></g><text x="1362" y="885" font-family="Arial, sans-seri