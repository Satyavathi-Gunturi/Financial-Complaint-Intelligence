087F8C" font-weight="700">02  SCHEDULED DATA PLATFORM</text><text x="428" y="276" font-family="Arial, sans-serif" font-size="12" fill="#63758A" font-weight="400">GitHub-hosted runner · temporary compute and storage</text><rect x="1250" y="225" width="405" height="770" rx="16" fill="#EAF0F6" stroke="#BBCAD8" stroke-width="1.5"/><text x="1268" y="254" font-family="Arial, sans-serif" font-size="15" fill="#3466AC" font-weight="700">03  RELEASE &amp; CONSUMPTION</text><text x="1268" y="276" font-family="Arial, sans-serif" font-size="12" fill="#63758A" font-weight="400">GitHub + Streamlit Community Cloud</text><rect x="65" y="445" width="285" height="150" rx="12" fill="#FFFFFF" stroke="#C1CFDD" stroke-width="1.5"/><rect x="65" y="459" width="5" height="122" rx="2" fill="#3466AC"/><rect x="81" y="463" width="54" height="54" rx="10" fill="#EEF3F8" stroke="#EEF3F8" stroke-width="1.5"/><g transform="translate(86,468)"><svg xmlns="http://www.w3.org/2000/svg" width="44" height="44" viewBox="0 0 44 44"><g fill="#3466AC" color="#3466AC"><path d="M8 30h26a9 9 0 0 0 1-18 13 13 0 0 0-24-1A10 10 0 0 0 8 30z"/></g></svg></g><text x="147" y="480" font-family="Arial, sans-serif" font-size="17" fill="#122B45" font-weight="700">CFPB archives</text><text x="147" y="500" font-family="Arial, sans-serif" font-size="11" fill="#3466AC" font-weight="700">EXTERNAL SYSTEM / ZIP + CSV</text><text x="85" y="545" font-family="Arial, sans-serif" font-size="13" fill="#40566C" font-weight="400">Narrative-bearing complaint exports</text><text x="85" y="568" font-family="Arial, sans-serif" font-size="13" fill="#40566C" font-weight="400">Release timing controlled by CFPB</text><rect x="435" y="295" width="350" height="130" rx="12" fill="#FFFFFF" stroke="#C1CFDD" stroke-width="1.5"/><rect x="435" y="309" width="5" height="102" rx="2" fill="#087F8C"/><rect x="451" y="313" width="54" height="54" rx="10" fill="#EEF3F8" stroke="#EEF3F8" stroke-width="1.5"/><g transform="translate(456,318)"><svg xmlns="http://ww