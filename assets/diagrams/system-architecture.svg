1185 725 L1280 725" fill="none" stroke="#63758A" stroke-width="2" marker-end="url(#arrow)"/><text x="1190" y="712" font-family="Arial, sans-serif" font-size="11" fill="#63758A" font-weight="400">Git / PR</text><path d="M1450 800 L1450 850" fill="none" stroke="#63758A" stroke-width="2" marker-end="url(#arrow)"/><text x="1462" y="827" font-family="Arial, sans-serif" font-size="11" fill="#63758A" font-weight="400">Merged files / redeploy</text><rect x="45" y="850" width="555" height="130" rx="14" fill="#FFFFFF" stroke="#C1CFDD" stroke-width="1.5"/><text x="63" y="878" font-family="Arial, sans-serif" font-size="14" fill="#7555A1" font-weight="700">DEVELOPMENT / RECOVERY  ·  COLAB + DRIVE</text><text x="63" y="904" font-family="Arial, sans-serif" font-size="12" fill="#63758A" font-weight="400">Interactive notebook and manually saved complete checkpoint</text><text x="63" y="925" font-family="Arial, sans-serif" font-size="12" fill="#63758A" font-weight="400">Separate from the runner; no Drive credentials in scheduled jobs</text><text x="63" y="946" font-family="Arial, sans-serif" font-size="12" fill="#63758A" font-weight="400">Full DB backups remain outside the release repository</text><rect x="630" y="850" width="580" height="130" rx="14" fill="#FFFFFF" stroke="#C1CFDD" stroke-width="1.5"/><text x="648" y="878" font-family="Arial, sans-serif" font-size="14" fill="#7555A1" font-weight="700">OPTIONAL AI  ·  GEMINI + SQL + BUSINESS CONTEXT</text><text x="648" y="904" font-family="Arial, sans-serif" font-size="12" fill="#63758A" font-weight="400">Free Tier key + access code; activation required</text><text x="648" y="925" font-family="Arial, sans-serif" font-size="12" fill="#63758A" font-weight="400">Aggregates + bounded narrative evidence sample</text><text x="648" y="946" font-family="Arial, sans-serif" font-size="12" fill="#63758A" font-weight="400">Business docs + constrained SQL + cited sources</text><rect x="45" y="1008" width="1610" height="67" rx="14" fill="#FFFFFF" 