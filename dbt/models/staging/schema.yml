version: 2
models:
- name: stg_complaints
  description: Cleaned complaint records. All source rows are retained; optional blanks
    become NULL and narrative text is preserved.
  columns:
  - name: complaint_id
    data_tests:
    - not_null
    - unique
  - name: company_name
    data_tests:
    - not_null
  - name: product
    data_tests:
    - not_null
  - name: submission_channel
    data_tests:
    - not_null
  - name: date_received
    data_tests:
    - not_null
  - name: date_sent_to_company
    data_tests:
    - not_null
  - name: timely_response
    data_tests:
    - not_null
