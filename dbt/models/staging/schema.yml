version: 2
models:
- name: stg_complaints
  description: Cleaned complaint records. All source rows are retained; optional blanks
    become NULL and narrative text is preserved.
  columns:
  - name: complaint_id
    data_tests:
    - not_null
    - unique
    description: Verified source complaint ID. Retained as text and unique at complaint
      grain.
  - name: company_name
    data_tests:
    - not_null
    description: Company name.
  - name: product
    data_tests:
    - not_null
    description: Product.
  - name: submission_channel
    data_tests:
    - not_null
    description: Submission channel.
  - name: date_received
    data_tests:
    - not_null
    description: Date received.
  - name: date_sent_to_company
    data_tests:
    - not_null
    description: Date sent to company.
  - name: timely_response
    data_tests:
    - not_null
    description: Timely response.
